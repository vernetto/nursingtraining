<head>

<title>Quiz Biochimica – Lezione 2</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3dfd9;--accent:#a3122a;--accent-soft:#f8e6e9;--ok:#1f7a4d;--ok-soft:#e3f3ea;--ko:#b3261e;--ko-soft:#fbe7e5;}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e22;--ink:#ececef;--muted:#a0a0a8;--line:#33333a;--accent:#e2566d;--accent-soft:#3a1c22;--ok:#5cc58f;--ok-soft:#173326;--ko:#f07a70;--ko-soft:#3a1d1b;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0 0 20px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.tag{display:inline-block;font-size:.75rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;margin-bottom:10px}
h2{font-size:1.15rem;margin:0 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--bg);border:1px solid var(--line)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--bg);border-left:4px solid var(--accent)}
.expl b{display:block;margin-bottom:2px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{padding:10px 18px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;user-select:none;font-size:.92rem}
.chip input{accent-color:var(--accent)}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.small{font-size:.85rem;color:var(--muted)}
.score{font-size:2.6rem;font-weight:800;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.review{margin-top:18px;display:grid;gap:12px}
.review .card{padding:14px}
.review .q{font-weight:600;margin-bottom:6px}
.review .yours{color:var(--ko)}
.review .right{color:var(--ok)}
.hidden{display:none}
@media (max-width:480px){h2{font-size:1.05rem}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Quiz di Biochimica – Lezione 2</h1>
  <p>Corso di Laurea in Infermieristica · 200 domande a risposta multipla</p>
</header>

<section id="setup" class="card">
  <fieldset>
    <legend>Argomenti</legend>
    <div class="chips" id="topics"></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="all">Tutti</button><button class="btn ghost" id="none">Nessuno</button></div>
  </fieldset>

    <legend>Numero di domande</legend>
    <div class="chips" id="counts"></div>
  </fieldset>

    </div>
  </fieldset>
  <p class="small" id="avail"></p>
  <div class="row"><button class="btn" id="start">Inizia</button></div>

    <div class="opts" id="opts"></div>
    <div class="expl hidden" id="expl"></div>

  <div class="row">
    <button class="btn" id="next" disabled>Avanti</button>

    <div class="row">
      <button class="btn" id="retryWrong">Ripeti gli errori</button>
      <button class="btn ghost" id="again">Nuovo quiz</button>
    </div>
  </div>
  <div class="review" id="review"></div>
</section>
</div>

<script>
const DATA = [["B","Che cosa studia la biochimica?","Le molecole degli esseri viventi e le loro trasformazioni","Solo la struttura delle cellule al microscopio","Esclusivamente le reazioni dei composti inorganici","Solo l'ereditarietà dei caratteri","La biochimica descrive struttura, organizzazione e funzione della materia vivente in termini molecolari."],["B","Quali sono le quattro principali classi di molecole biologiche?","Carboidrati, lipidi, proteine, acidi nucleici","Carboidrati, vitamine, minerali, acqua","Proteine, enzimi, ormoni, vitamine","Lipidi, steroidi, fosfolipidi, cere","Sono le quattro classi di biomolecole presentate nel riassunto iniziale."],["B","Quali elementi costituiscono la maggior parte delle biomolecole?","C, H, O, N, con P e S in misura minore","Fe, Cu, Zn, Mg","Na, K, Cl, Ca","He, Ne, Ar, Kr","Carbonio, idrogeno, ossigeno, azoto, fosforo e zolfo sono gli elementi principali delle biomolecole."],["B","Quale frase riassume il principio della biochimica strutturale?","Dalla composizione alla forma, dalla forma alla funzione","La funzione determina la sequenza","La forma non influenza la funzione","La composizione è irrilevante per la struttura","La sequenza determina la struttura tridimensionale, e la struttura determina la funzione."],["B","Secondo la lezione, qual è il tema centrale della biochimica?","L'energia","La classificazione dei tessuti","La genetica di popolazione","L'anatomia comparata","Ogni processo biologico richiede, converte o libera energia."],["B","Quale NON è uno dei tre motivi per cui mangiamo, secondo la slide «Perché mangiamo?»","Aumentare la temperatura dell'ambiente","Ottenere energia","Crescita e riparazione dei tessuti","Regolazione (vitamine, minerali, molecole indispensabili)","I tre motivi sono energia, crescita e riparazione, regolazione."],["B","Nell'anemia falciforme la struttura dell'emoglobina è alterata perché:","Un singolo amminoacido è sostituito da un altro","Manca il gruppo eme","Il ferro è sempre Fe3+","Manca una delle quattro subunità","Una sola sostituzione amminoacidica cambia la forma della proteina, che tende ad aggregarsi deformando i globuli rossi."],["B","Un hamburger contiene 47 g di carboidrati, 30 g di lipidi e 25 g di proteine. Quante kcal fornisce circa?","Circa 560 kcal","Circa 410 kcal","Circa 920 kcal","Circa 300 kcal","47×4 + 30×9 + 25×4 = 188 + 270 + 100 ≈ 558 kcal."],["B","Nell'esempio dell'hamburger, quale macronutriente fornisce più energia?","I lipidi","I carboidrati","Le proteine","Carboidrati e proteine in parti uguali, più dei lipidi","30 g di lipidi forniscono 270 kcal, più dei 47 g di carboidrati (188 kcal)."],["B","Quante kcal forniscono circa 20 g di lipidi?","180 kcal","80 kcal","140 kcal","20 kcal","20 g × 9 kcal/g = 180 kcal."],["B","Un paziente in nutrizione enterale riceve 60 g di proteine al giorno. Quante kcal derivano dalle proteine?","240 kcal","540 kcal","420 kcal","60 kcal","60 g × 4 kcal/g = 240 kcal."],["C","Con quale altro nome sono chiamati i carboidrati?","Saccaridi o glucidi","Lipidi","Peptidi","Nucleotidi","Carboidrati, saccaridi e glucidi sono sinonimi."],["C","Quali elementi compongono i carboidrati?","Carbonio, idrogeno e ossigeno","Carbonio, azoto e zolfo","Solo carbonio e idrogeno","Carbonio, fosforo e ferro","La formula empirica approssimativa di molti monosaccaridi è (CH2O)n."],["C","La formula (CH2O)n:","Vale approssimativamente per molti monosaccaridi, ma non per tutti i carboidrati","Vale per tutti i carboidrati senza eccezioni","Vale per tutti i lipidi","È la formula dei polipeptidi","Non è universale: ad esempio il deossiribosio ha un ossigeno in meno."],["C","Quale affermazione sui carboidrati nella dieta è corretta secondo la lezione?","Non esiste un singolo carboidrato considerato essenziale","Il glucosio è un nutriente essenziale che il fegato non sa produrre","Il lattosio è essenziale per l'adulto","Il saccarosio è indispensabile per il cervello","Il fegato può produrre glucosio per gluconeogenesi; fibre e alimenti ricchi di carboidrati hanno comunque importanti funzioni nutrizionali."],["C","Quale funzione NON è attribuita ai carboidrati nella lezione?","Catalisi enzimatica","Energetica","Riconoscimento cellulare","Riserva","Le funzioni elencate sono energetica, strutturale, riconoscimento cellulare e riserva."],["C","Perché i globuli rossi dipendono strettamente dal glucosio?","Non hanno mitocondri e producono ATP con la glicolisi","Hanno troppi mitocondri","Usano solo acidi grassi","Producono glucosio da soli","Gli eritrociti non possono ossidare acidi grassi: dipendono da glucosio e glicolisi."],["C","Nel digiuno prolungato, quale combustibile alternativo può utilizzare il cervello?","I corpi chetonici","Gli acidi grassi a catena lunga direttamente","Il glicogeno muscolare rilasciato nel sangue","Il colesterolo","Il cervello utilizza anche corpi chetonici, riducendo il fabbisogno di glucosio."],["C","Quanto glucosio consuma circa il cervello al giorno?","Circa 120 g","Circa 12 g","Circa 500 g","Circa 1 kg","Circa 120 g/die, pari a circa 480 kcal."],["C","Il glucosio attraversa la barriera ematoencefalica tramite:","Trasporto facilitato mediato da GLUT1","Diffusione semplice attraverso i lipidi","Pompa sodio-potassio","Endocitosi mediata da LDL","Il trasporto facilitato tramite GLUT1 non consuma energia."],["C","Il cervello rappresenta circa il 2% del peso corporeo. Quale percentuale del glucosio a riposo consuma?","Circa il 25%","Circa il 2%","Circa il 70%","Circa il 5%","Il cervello consuma circa il 25% del glucosio e il 20% dell'ossigeno a riposo."],["C","Il glucosio è classificato come:","Aldoesoso","Chetoesoso","Aldopentoso","Chetopentoso","Ha sei atomi di carbonio e un gruppo aldeidico sul C1 nella forma aperta."],["C","Il fruttosio è classificato come:","Chetoesoso","Aldoesoso","Aldopentoso","Disaccaride","Ha sei atomi di carbonio e un gruppo chetonico sul C2 nella forma aperta."],["C","Glucosio e fruttosio hanno entrambi formula C6H12O6. Sono quindi:","Isomeri strutturali","Polimeri","Lo stesso composto","Enantiomeri identici","Stesso numero di atomi, diverso gruppo carbonilico (aldeidico vs chetonico)."],["C","La forma ciclica del glucosio è un anello a:","Sei membri (piranosio)","Cinque membri (furanosio)","Quattro membri","Sette membri","Il D-glucopiranosio è un anello a sei membri."],["C","La forma ciclica del fruttosio rappresentata in lezione è:","Un anello a cinque membri (fruttofuranosio)","Un anello a sei membri (fruttopiranosio)","Un anello a tre membri","Una catena aperta che non cicla mai","Il β-D-fruttofuranosio è un anello a cinque membri."],["C","Che cosa distingue il 2-deossi-D-ribosio dal ribosio?","Ha un H invece di un OH sul carbonio 2'","Ha sei atomi di carbonio","Ha un gruppo chetonico","Ha un fosfato sul C2'","Il deossiribosio è privo dell'ossigeno sul C2'."],["C","Il 2-deossi-D-ribosio è lo zucchero presente in:","DNA","RNA","Saccarosio","Glicogeno","Il ribosio (con OH sul C2') è nell'RNA; il deossiribosio nel DNA."],["C","Come si forma un disaccaride?","Due monosaccaridi si uniscono con un legame glicosidico liberando acqua","Due monosaccaridi si uniscono consumando acqua","Un monosaccaride si lega a un acido grasso","Due amminoacidi si legano con legame peptidico","È una reazione di condensazione; la reazione inversa è l'idrolisi."],["C","Il saccarosio è formato da:","Glucosio + fruttosio","Glucosio + galattosio","Glucosio + glucosio","Galattosio + fruttosio","Lo zucchero da cucina: legame α(1→2)β."],["C","Il lattosio è formato da:","Galattosio + glucosio","Glucosio + fruttosio","Due glucosi","Galattosio + fruttosio","Lo zucchero del latte, con legame β(1→4)."],["C","Il maltosio è formato da:","Due molecole di glucosio","Glucosio + fruttosio","Glucosio + galattosio","Due molecole di fruttosio","Legame α(1→4); deriva dalla digestione dell'amido."],["C","Il legame glicosidico del lattosio è di tipo:","β(1→4)","α(1→4)","α(1→2)β","α(1→6)","Il lattosio ha un legame β(1→4)."],["C","Il legame glicosidico del saccarosio è di tipo:","α(1→2)β","β(1→4)","α(1→4)","α(1→6)","Unisce il C1 del glucosio al C2 del fruttosio."],["C","Quanti monosaccaridi contiene un polisaccaride secondo la lezione?","Da circa 10^2 a 10^8","Da 2 a 10","Esattamente 1000","Da 3 a 9","I polisaccaridi sono polimeri di centinaia fino a milioni di unità."],["C","Gli omopolisaccaridi sono formati da:","Un solo tipo di monosaccaride","Due o più tipi di monosaccaridi","Monosaccaridi legati a proteine","Monosaccaridi legati a lipidi","Esempi: amido, glicogeno, cellulosa."],["C","Quale è un esempio di eteropolisaccaride?","Glicosaminoglicani (mucopolisaccaridi)","Amido","Glicogeno","Cellulosa","Gli eteropolisaccaridi contengono due o più tipi di monosaccaridi."],["C","Glicolipidi e glicoproteine sono esempi di:","Polisaccaridi coniugati","Omopolisaccaridi","Disaccaridi","Monosaccaridi","Sono catene glucidiche associate a lipidi o proteine."],["C","Amido, glicogeno e cellulosa hanno in comune:","Il monomero glucosio","Lo stesso tipo di legame glicosidico","La stessa funzione","La stessa ramificazione","Stesso monomero, ma struttura e funzione diverse."],["C","Quale differenza fondamentale distingue la cellulosa dall'amido?","La cellulosa ha legami β(1→4), l'amido legami α","La cellulosa è formata da fruttosio","L'amido contiene azoto","La cellulosa è molto ramificata","I nostri enzimi rompono i legami α ma non i β(1→4) della cellulosa."],["C","Perché l'uomo non digerisce la cellulosa?","Manca l'enzima cellulasi","La cellulosa è solubile e viene assorbita intatta","La cellulosa viene distrutta dall'acido gastrico","La cellulosa è troppo piccola","Senza cellulasi la cellulosa arriva al colon come fibra insolubile."],["C","Come riescono i ruminanti a utilizzare la cellulosa?","Grazie a microrganismi simbionti che producono cellulasi","Producono amilasi più potenti","Hanno uno stomaco acidissimo","La assorbono senza digerirla","Ruminanti, termiti e alcuni insetti sfruttano il loro microbiota."],["C","Quale effetto NON è attribuito a una dieta ricca di fibre?","Aumento rapido della glicemia","Aumento del volume fecale","Accelerazione del transito intestinale","Riduzione del tempo di contatto della mucosa con sostanze nocive","Le fibre tendono anzi a rallentare l'assorbimento degli zuccheri."],["C","Un elevato consumo di fibre alimentari è associato a:","Minor rischio di carcinoma colorettale","Maggior rischio di carcinoma colorettale","Aumento del colesterolo LDL","Ipoglicemia","È un'associazione osservata negli studi di popolazione."],["C","L'accumulo del glucosio sotto forma di amido nelle cellule vegetali serve anche a:","Limitare l'aumento della pressione osmotica","Aumentare la pressione osmotica","Rendere la cellula più acida","Produrre cellulosa","Un polimero conta come poche particelle: richiama meno acqua di tante molecole libere."],["C","Che cosa accade all'amido riscaldato in acqua?","I granuli assorbono acqua e rigonfiano (gelatinizzazione)","Si trasforma in cellulosa","Si scinde spontaneamente in glucosio","Diventa insolubile e cristallino","È la gelatinizzazione dell'amido, sfruttata anche dagli addensanti."],["C","In quale organello delle cellule vegetali si accumulano i granuli di amido?","Amiloplasto","Mitocondrio","Lisosoma","Nucleo","L'amiloplasto è specializzato nell'accumulo di amido."],["C","L'amido è formato da:","Amilosio (circa 20%) e amilopectina (circa 80%)","Amilosio (circa 80%) e amilopectina (circa 20%)","Glicogeno e cellulosa","Solo amilosio","Amido = amilosio + amilopectina; monomero α-D-glucosio."],["C","L'amilosio è:","Una catena essenzialmente lineare con legami α(1→4) e conformazione elicoidale","Una catena molto ramificata con legami α(1→6)","Una catena lineare con legami β(1→4)","Un disaccaride","L'amilosio forma un'elica."],["C","I punti di ramificazione dell'amilopectina sono legami:","α(1→6)","α(1→4)","β(1→4)","α(1→2)β","La catena principale ha legami α(1→4), le ramificazioni α(1→6)."],["C","Rispetto all'amilopectina, ossigeno?","Fe2+","Fe3+","Fe0","Fe4+","Il Fe3+ non lega l'ossigeno."],["H","Quale amminoacido della globina si lega al ferro dell'eme dal basso?","Istidina prossimale","Cisteina","Glicina","Triptofano","Tiene il ferro in posizione."],["H","Quale ruolo ha la globina nei confronti dell'eme?","Modula l'affinità per l'O2 e protegge il ferro dall'ossidazione","Fornisce il ferro","Lega direttamente l'O2 con le catene laterali","Trasforma l'eme in bilirubina","Gli amminoacidi da soli non danno un legame reversibile efficace."],["H","Quale NON è una funzione dell'emoglobina?","Digerire i grassi","Trasportare O2","Azione tampone legando H+","Trasportare parte della CO2","Sono le tre funzioni presentate."],["H","In che forma viaggia la maggior parte della CO2 nel sangue?","Bicarbonato (HCO3-)","Carbamminoemoglobina","CO2 legata al ferro","Monossido di carbonio","Solo una quota viaggia come carbamminoemoglobina."],["H","La metaemoglobina contiene ferro:","Fe3+ e non trasporta ossigeno","Fe2+ e trasporta più ossigeno","Legato al monossido di carbonio","Assente","Si forma per ossidazione del ferro dell'eme."],["H","Il monossido di carbonio è pericoloso perché:","Si lega all'eme molto più tenacemente dell'ossigeno","Ossida il colesterolo","Distrugge la globina","Blocca la lattasi","Molti saturimetri comuni non lo distinguono dall'ossiemoglobina."],["H","La degradazione dell'eme produce:","Bilirubina","Colesterolo","Urea","Glucosio","Il suo accumulo causa ittero."],["M","Il catabolismo:","Demolisce nutrienti in prodotti più semplici liberando energia","Costruisce molecole complesse consumando energia","Avviene solo nelle piante","Non coinvolge ossidoriduzioni","È esoergonico."],["M","L'anabolismo:","Converte molecole semplici in molecole caratteristiche della cellula consumando energia","Libera energia demolendo nutrienti","Produce solo CO2","Avviene solo nel colon","È endoergonico."],["M","Quali sono i prodotti semplici finali del catabolismo indicati nello schema del metabolismo?","CO2, NH3 e H2O","Glucosio e ossigeno","Colesterolo e acidi biliari","ATP e glicogeno","Sono anche precursori per l'anabolismo."],["M","Una via metabolica è:","Una serie di reazioni catalizzate da enzimi, spesso in un compartimento specifico","Un singolo enzima","Un vaso sanguigno","Una sequenza di DNA","Ad esempio la glicolisi nel citosol."],["M","Il flusso attraverso una via metabolica dipende soprattutto da:","L'attività degli enzimi che catalizzano le reazioni irreversibili","La temperatura ambiente","Il colore della molecola","Il numero di mitocondri soltanto","Sono i punti di controllo della via."],["M","Quale NON è un meccanismo di regolazione degli enzimi citato nella lezione?","Cambiamento del gruppo sanguigno","Regolazione allosterica","Modificazioni covalenti","Variazioni dell'espressione genica","Si citano anche i cicli del substrato."],["M","I macronutrienti sono:","Proteine, carboidrati e lipidi","Vitamine e minerali","Solo acqua","Ferro e iodio","Vitamine e minerali sono micronutrienti."],["M","Nell'ossidazione, una molecola:","Perde elettroni","Acquista elettroni","Acquista protoni senza elettroni","Non cambia","Ossidazione e riduzione avvengono sempre insieme."],["M","Quale trasportatore di elettroni è usato soprattutto nelle vie anaboliche?","NADPH","FADH2","ATP","Ossigeno","Il NADH porta gli elettroni soprattutto verso la catena respiratoria."],["M","Quante kcal/g fornisce l'alcol?","Circa 7","Circa 4","Circa 9","Circa 1","Circa 29 kJ/g."],["M","Una chilocaloria equivale a circa:","4,18 kJ","1 kJ","9,3 kJ","17 kJ","È l'energia per scaldare 1 kg d'acqua di 1 °C (da 14,5 a 15,5 °C)."],["M","Da quali componenti è formato l'ATP?","Adenina, ribosio e tre gruppi fosfato","Adenina, deossiribosio e un fosfato","Guanina, ribosio e due fosfati","Glucosio e tre fosfati","Adenosina 5'-trifosfato."],["M","L'idrolisi dell'ATP produce:","ADP e fosfato inorganico (Pi), liberando energia","AMP e glucosio","ATP e acqua","Glicogeno","La reazione è accoppiata ai processi che richiedono energia."],["M","Quale ione forma un complesso con l'ATP nella cellula?","Mg2+","Fe2+","Cl-","Na+","Molti enzimi riconoscono il complesso Mg-ATP."],["M","Nello stadio 1 del catabolismo, amminoacidi, acidi grassi e glucosio convergono in:","Acetil-CoA","Lattosio","Colesterolo","Urea","Il glucosio vi arriva dopo glicolisi e piruvato deidrogenasi."],["M","Dove avviene il ciclo dell'acido citrico?","Nei mitocondri","Nel citosol","Nel nucleo","Nel lume intestinale","Ossida l'acetil-CoA e produce NADH e FADH2."],["M","Qual è l'accettore finale degli elettroni nella catena respiratoria?","Ossigeno","Glucosio","NAD+","CO2","L'ossigeno si combina con H+ formando acqua."],["M","La glicolisi:","Comprende 10 reazioni nel citosol e trasforma il glucosio in 2 piruvati","Avviene nei mitocondri e produce CO2","Richiede ossigeno","Produce colesterolo","Produce ATP e NADH."],["M","Quale via del glucosio produce ribosio 5-fosfato e NADPH?","Via dei pentoso fosfati","Glicolisi","Ciclo dell'acido citrico","Lipolisi","Il ribosio 5-fosfato serve per i nucleotidi."],["M","In assenza di ossigeno, il piruvato viene trasformato soprattutto in:","Lattato","Acetil-CoA","Colesterolo","Urea","Permette alla glicolisi di proseguire con una resa bassa."],["M","Quale prodotto contiene l'azoto eliminato dal catabolismo degli amminoacidi?","Urea","CO2","Glicerolo","Lattato","L'urea è prodotta dal fegato ed eliminata dai reni."],["K","Un paziente diabetico in insulina è sudato, tremante e confuso. Prima azione infermieristica?","Misurare la glicemia capillare","Somministrare un'altra dose di insulina","Farlo sdraiare e attendere","Offrire un pasto ricco di grassi","Il cervello, privo di riserve, va in sofferenza per primo."],["K","Per correggere un'ipoglicemia in un paziente cosciente si preferisce:","Glucosio o zucchero sciolto in acqua o succo","Cioccolato","Formaggio","Un bicchiere di latte intero","I grassi rallentano lo svuotamento gastrico."],["K","Un paziente in terapia con inibitori dell'α-glucosidasi va in ipoglicemia. Cosa somministrare?","Glucosio puro","Zucchero da cucina (saccarosio)","Pane","Pasta","La digestione di disaccaridi e amido è rallentata dal farmaco."],["K","Un paziente con ostruzione delle vie biliari ha ecchimosi e sanguinamenti facili. Quale carenza è più probabile?","Vitamina K","Vitamina C","Vitamina B12","Ferro","Senza bile si assorbono male i grassi e le vitamine liposolubili."],["K","Perché un saturimetro può dare valori rassicuranti in un'intossicazione da CO?","Molti saturimetri comuni non distinguono la carbossiemoglobina dall'ossiemoglobina","Il CO abbassa la temperatura del dito","Il CO aumenta la quantità di emoglobina","Il saturimetro misura la CO2","Bisogna sospettarla in base al contesto."],["K","Durante una trasfusione compaiono febbre, brividi, dolore lombare e ipotensione. Cosa fare per primo?","Interrompere subito la trasfusione mantenendo l'accesso venoso e avvisare il medico","Aumentare la velocità di infusione","Rimuovere l'accesso venoso","Somministrare glucosio","Possibile reazione emolitica acuta da incompatibilità ABO."],["K","Un paziente in terapia con gliflozine (inibitori SGLT2) ha glucosio nelle urine. Questo è:","Un effetto atteso del farmaco","Sempre segno di scompenso grave","Impossibile","Segno di intolleranza al lattosio","Il farmaco blocca il riassorbimento renale del glucosio."],["K","Quale effetto collaterale va sorvegliato in un paziente che inizia una terapia con corticosteroidi?","Iperglicemia","Ipoglicemia grave","Ipercalcemia","Bradicardia estrema","I corticosteroidi imitano il cortisolo, che aumenta la glicemia."],["K","In un paziente con abuso cronico di alcol, quale vitamina si somministra spesso prima delle soluzioni glucosate?","Tiamina (B1)","Vitamina K","Vitamina D","Vitamina A","Il metabolismo del glucosio consuma tiamina e può far precipitare l'encefalopatia di Wernicke."],["K","Un paziente con diabete di tipo 1 non mangia per febbre. Quale consiglio è corretto?","Non sospendere mai del tutto l'insulina basale e controllare più spesso glicemia e chetoni","Sospendere tutta l'insulina finché non mangia","Bere solo acqua senza controlli","Assumere corticosteroidi","L'insulina basale frena anche la lipolisi e la chetogenesi."],["K","Un lattato elevato all'emogasanalisi in un paziente settico indica soprattutto:","Ipoperfusione dei tessuti con metabolismo anaerobio","Eccesso di fibre nella dieta","Intolleranza al lattosio","Normale funzione mitocondriale","La sua riduzione indica risposta alle terapie."],["K","Perché le bibite zuccherate non sono adatte per reidratare un bambino con gastroenterite?","Troppo zucchero e poco sodio: possono peggiorare la diarrea richiamando acqua","Contengono troppo sodio","Non contengono acqua","Bloccano il GLUT2","Le soluzioni reidratanti orali hanno proporzioni corrette di sodio e glucosio."],["K","Un paziente allettato in terapia con oppioidi non evacua da 4 giorni. Quale intervento è appropriato?","Valutare l'alvo, favorire idratazione e mobilizzazione, segnalare per eventuale terapia","Aumentare solo le fibre senza liquidi","Sospendere autonomamente l'oppioide","Ignorare finché non compare dolore","Fibre senza acqua possono peggiorare la stipsi."],["K","Un paziente con iperpotassiemia grave può ricevere insulina con glucosio perché l'insulina:","Sposta il potassio all'interno delle cellule","Elimina il potassio con le feci","Blocca la pompa Na+/K+","Trasforma il potassio in sodio","Si monitora strettamente la glicemia."],["K","Il cloruro di potassio concentrato:","Non si somministra mai in bolo endovenoso: va diluito e infuso lentamente","Si somministra in bolo rapido","Si somministra per via sottocutanea","Non ha rischi","È un farmaco ad alto rischio."],["K","Una persona con carenza di G6PD (favismo) è a rischio di:","Crisi emolitica dopo fave o alcuni farmaci","Ipercolesterolemia","Intolleranza al lattosio","Fenilchetonuria","I globuli rossi hanno poco NADPH per le difese antiossidanti."],["K","Le insuline, essendo proteine:","Non vanno congelate né esposte al calore, e non si assumono per bocca","Si possono assumere per bocca","Resistono a qualsiasi temperatura","Si conservano in freezer","Gli enzimi digestivi e la denaturazione ne distruggono la struttura."],["K","La fenilchetonuria si individua con:","Lo screening neonatale su sangue dal tallone","Il breath test all'idrogeno","L'emogasanalisi","La PET","Si tratta con una dieta a basso contenuto di fenilalanina."],["K","L'emoglobina glicata (HbA1c) riflette:","La glicemia media degli ultimi 2-3 mesi","La glicemia dell'ultima ora","Il colesterolo LDL","La saturazione di ossigeno","I globuli rossi vivono circa 120 giorni."],["K","Prima di una PET con analogo del glucosio, il paziente deve:","Essere a digiuno, con glicemia controllata, evitando sforzi muscolari","Mangiare un pasto ricco di zuccheri","Fare attività fisica intensa","Assumere un lassativo","Glucosio alto o muscoli attivi alterano la distribuzione del tracciante."]];
const TOPICS = {B:"Biomolecole ed energia",C:"Carboidrati",D:"Digestione e assorbimento",L:"Lipidi",S:"Colesterolo, steroidi, gruppi ABO",P:"Proteine",H:"Emoglobina ed eme",M:"Metabolismo e ATP",K:"Casi clinici"};
const $ = id => document.getElementById(id);
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const items = DATA.map((r,i)=>({id:i,t:r[0],q:r[1],ok:r[2],wrong:[r[3],r[4],r[5]],e:r[6]}));
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// setup UI
const counts = {};items.forEach(x=>counts[x.t]=(counts[x.t]||0)+1);
const saved = store.get("bq2-topics", Object.keys(TOPICS));
$("topics").innerHTML = Object.keys(TOPICS).map(k=>`<label class="chip"><input type="checkbox" value="${k}" ${saved.includes(k)?"checked":""}> ${TOPICS[k]} <span class="small">(${counts[k]||0})</span></label>`).join("");
$("counts").innerHTML = [10,20,50,100,"Tutte"].map((n,i)=>`<label class="chip"><input type="radio" name="count" value="${n}" ${i===1?"checked":""}> ${n}</label>`).join("");
const selTopics = () => [...document.querySelectorAll("#topics input:checked")].map(x=>x.value);
const updAvail = () => {const n=items.filter(x=>selTopics().includes(x.t)).length;$("avail").textContent=`Domande disponibili con questa selezione: ${n}`;$("start").disabled=!n};
$("topics").addEventListener("change",updAvail);
$("all").onclick=()=>{document.querySelectorAll("#topics input").forEach(x=>x.checked=true);updAvail()};
$("none").onclick=()=>{document.querySelectorAll("#topics input").forEach(x=>x.checked=false);updAvail()};
updAvail();

let run=null;
function start(pool){
  const mode=document.querySelector("input[name=mode]:checked").value;
  run={list:pool.map(it=>({it,opts:shuffle([it.ok,...it.wrong]),pick:null})),i:0,mode};
  $("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  show();
}
$("start").onclick=()=>{
  const ts=selTopics();store.set("bq2-topics",ts);
  const c=document.querySelector("input[name=count]:checked").value;
  let pool=shuffle(items.filter(x=>ts.includes(x.t)));
  if(c!=="Tutte") pool=pool.slice(0,+c);
  start(pool);
};

function show(){
  const cur=run.list[run.i], n=run.list.length;
  $("prog").style.width=(run.i/n*100)+"%";
  $("pos").textContent=`Domanda ${run.i+1} di ${n}`;
  const done=run.list.filter(x=>x.pick!==null);
  $("live").textContent=run.mode==="study"&&done.length?`Corrette: ${done.filter(x=>x.pick===x.it.ok).length}/${done.length}`:"";
  $("qtag").textContent=TOPICS[cur.it.t];
  $("qtext").textContent=cur.it.q;
  $("opts").innerHTML="";
  cur.opts.forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<span class="k">${"ABCD"[k]}</span><span></span>`;b.lastChild.textContent=o;
    b.onclick=()=>answer(k);$("opts").appendChild(b);
  });
  $("expl").classList.add("hidden");
  $("next").disabled=true;$("next").textContent=run.i===n-1?"Vedi risultato":"Avanti";
  if(cur.pick!==null) paint();
}
function answer(k){
  const cur=run.list[run.i];
  if(cur.pick!==null && run.mode==="study") return;
  cur.pick=cur.opts[k];
  if(run.mode==="study") paint();
  else {[...$("opts").children].forEach((b,j)=>b.style.borderColor=j===k?"var(--accent)":"");}
  $("next").disabled=false;
}
function paint(){
  const cur=run.list[run.i];
  [...$("opts").children].forEach((b,j)=>{
    const o=cur.opts[j];b.disabled=true;
    if(o===cur.it.ok)b.classList.add("ok");else if(o===cur.pick)b.classList.add("ko");
  });
  const right=cur.pick===cur.it.ok;
  $("expl").innerHTML=`<b>${right?"Corretto!":"Non corretto."}</b><span></span>`;
  $("expl").lastChild.textContent=cur.it.e;
  $("expl").classList.remove("hidden");
}
$("next").onclick=()=>{if(run.i<run.list.length-1){run.i++;show()}else finish()};
$("quit").onclick=finish;
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden"))return;
  if(["1","2","3","4"].includes(e.key))answer(+e.key-1);
  if(e.key==="Enter"&&!$("next").disabled)$("next").click();
});

function finish(){
  const ans=run.list.filter(x=>x.pick!==null);
  const good=ans.filter(x=>x.pick===x.it.ok);
  $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
  const pct=ans.length?Math.round(good.length/ans.length*100):0;
  $("score").textContent=`${good.length} / ${ans.length}  ·  ${pct}%`;
  $("verdict").textContent=pct>=90?"Ottimo lavoro!":pct>=70?"Buona preparazione: ripassa gli argomenti con più errori.":pct>=50?"Sufficiente, ma serve ancora un ripasso.":"Conviene riascoltare la lezione e riprovare.";
  const bt={};ans.forEach(x=>{const t=x.it.t;bt[t]=bt[t]||[0,0];bt[t][1]++;if(x.pick===x.it.ok)bt[t][0]++});
  $("bytopic").innerHTML="<tr><th>Argomento</th><th class='n'>Corrette</th></tr>"+Object.keys(bt).map(t=>`<tr><td>${TOPICS[t]}</td><td class="n">${bt[t][0]}/${bt[t][1]}</td></tr>`).join("");
  const wrong=ans.filter(x=>x.pick!==x.it.ok);
  const hist=store.get("bq2-wrong",[]);store.set("bq2-wrong",[...new Set([...hist.filter(id=>!good.some(g=>g.it.id===id)),...wrong.map(x=>x.it.id)])]);
  $("retryWrong").disabled=!wrong.length;
  $("retryWrong").onclick=()=>start(shuffle(wrong.map(x=>x.it)));
  $("review").innerHTML="";
  wrong.forEach(x=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="q"></div><div class="yours"></div><div class="right"></div><div class="small" style="margin-top:6px"></div>`;
    d.children[0].textContent=x.it.q;d.children[1].textContent="✗ "+x.pick;d.children[2].textContent="✓ "+x.it.ok;d.children[3].textContent=x.it.e;
    $("review").appendChild(d);
  });
  $("prog").style.width="100%";window.scrollTo(0,0);
}
$("again").onclick=()=>{$("result").classList.add("hidden");$("setup").classList.remove("hidden")};
</script>

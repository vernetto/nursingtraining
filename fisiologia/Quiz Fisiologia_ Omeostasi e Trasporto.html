 raddoppiare", "Non cambia volume", "Perde acqua e si rimpicciolisce", "Perde soluti fino a 150"], "a": 0, "e": "La forza di richiamo del globulo rosso (300) è maggiore di quella esterna (150): l'acqua entra, la cellula si gonfia e, nell'esempio, raddoppia il volume fino a quando le osmolarità interna ed esterna si uguagliano a 150."}, {"s": 49, "q": "Una cellula immersa in una soluzione ipotonica:", "o": ["Diminuisce di volume", "Resta identica", "Aumenta di volume", "Si dissolve senza assorbire acqua"], "a": 2, "e": "La slide conclude: cellula immersa in soluzione ipotonica aumenta di volume. Ipotonica significa con minore concentrazione di soluti non permeanti rispetto all'interno della cellula."}, {"s": 49, "q": "Quando cessa l'ingresso di acqua nel globulo rosso immerso in soluzione ipotonica?", "o": ["Dopo esattamente un minuto", "Quando le osmolarità interna ed esterna diventano uguali", "Quando la cellula ha consumato tutto l'ATP", "Mai"], "a": 1, "e": "Il processo cessa quando le osmolarità delle due soluzioni sono uguali: nella figura entrambe arrivano a 150 e il volume cellulare è raddoppiato (2V₀)."}, {"s": 49, "q": "Perché il globulo rosso in soluzione a 150 mOsm raddoppia il volume?", "o": ["Perché la membrana si rompe", "Perché per dimezzare la propria osmolarità da 300 a 150, con la stessa quantità di soluti, deve raddoppiare il volume d'acqua", "Perché raddoppiano i soluti interni", "Perché entra NaCl"], "a": 1, "e": "I soluti interni non cambiano; cambia solo l'acqua. Per passare da 300 a 150 mOsm la stessa quantità di soluti deve essere sciolta in un volume doppio: la cellula passa da V₀ a 2V₀."}, {"s": 50, "q": "Un globulo rosso (300 mOsm) è immerso in una soluzione a 600 mOsm. Cosa accade?", "o": ["Perde acqua e si rimpicciolisce fino a circa metà del volume", "Raddoppia i soluti interni", "Richiama acqua e si gonfia", "Non cambia volume"], "a": 0, "e": "La soluzione esterna richiama acqua con forza maggiore: l'acqua esce, la cellula si rimpicciolisce e, nell'esempio, arriva alla metà del volume (½V₀), quando l'osmolarità interna sale a 600."}, {"s": 50, "q": "Una cellula immersa in una soluzione ipertonica:", "o": ["Aumenta di volume", "Diminuisce di volume", "Resta identica", "Si divide"], "a": 1, "e": "La slide conclude: cellula immersa in soluzione ipertonica diminuisce di volume. Ipertonica significa con concentrazione maggiore di soluti non permeanti rispetto all'interno della cellula."}, {"s": 50, "q": "Nella figura sulla soluzione ipertonica, qual è il volume finale del globulo rosso?", "o": ["V₀", "2 V₀", "½ V₀", "¼ V₀"], "a": 2, "e": "Per passare da 300 a 600 mOsm con la stessa quantità di soluti interni, il volume d'acqua deve dimezzarsi: il volume cellulare diventa ½V₀."}, {"s": 50, "q": "Una soluzione con la stessa concentrazione di soluti non permeanti dell'interno della cellula si dice:", "o": ["Ipertonica, e la cellula si raggrinzisce", "Isotonica, e il volume cellulare non cambia", "Ipotonica, e la cellula si gonfia", "Osmotica, e la cellula si rompe"], "a": 1, "e": "Per completezza rispetto ai due casi della slide: se la tonicità esterna è uguale a quella interna (per esempio 300 contro 300), non c'è flusso netto di acqua e il volume della cellula resta invariato. La soluzione si dice isotonica."}, {"s": 51, "q": "Come è contenuta l'acqua nel nostro corpo?", "o": ["In diversi compartimenti separati gli uni dagli altri", "Solo nel sangue", "In un unico compartimento continuo", "Solo dentro le cellule"], "a": 0, "e": "La slide spiega che all'interno del corpo l'acqua è contenuta in diversi compartimenti separati. Questi compartimenti devono essere mantenuti in equilibrio."}, {"s": 51, "q": "Quale percentuale del nostro corpo è costituita da acqua secondo la slide?", "o": ["Circa il 90%", "Circa il 60%", "Circa il 40%", "Circa il 20%"], "a": 1, "e": "La slide ricorda che siamo fatti al 60% di acqua: per questo la sua distribuzione nei compartimenti ha un'importanza cruciale."}, {"s": 51, "q": "Perché la posizione dell'acqua nell'organismo ha importanza cruciale?", "o": ["Perché l'acqua non si sposta mai", "Perché l'acqua è un soluto", "Perché l'acqua è presente solo nel plasma", "Perché l'acqua costituisce circa il 60% del corpo e i compartimenti vanno tenuti in equilibrio"], "a": 3, "e": "Essendo l'acqua il 60% del corpo e distribuita in compartimenti separati, uno spostamento tra di essi (per esempio dalle cellule al plasma) modifica volumi e concentrazioni. Questi equilibri vanno mantenuti."}, {"s": 51, "q": "L'acqua contenuta dentro le cellule rispetto a quella fuori:", "o": ["Non ha relazione con quella esterna", "È mescolata senza alcuna barriera", "È sempre di volume uguale", "È separata, e i due compartimenti devono essere tenuti in equilibrio"], "a": 3, "e": "La slide afferma che l'acqua dentro le cellule è separata da quella contenuta fuori e che questi compartimenti devono essere tenuti in equilibrio."}, {"s": 52, "q": "A quanto ammonta l'acqua corporea totale (TBW) nell'esempio della slide?", "o": ["14 litri", "42 litri", "60 litri", "28 litri"], "a": 1, "e": "L'acqua corporea totale indicata è di 42 litri, ripartita in 28 litri intracellulari e 14 litri extracellulari."}, {"s": 52, "q": "A quanto ammonta il liquido intracellulare (ICF) nell'esempio della slide?", "o": ["Circa 11 litri", "Circa 3 litri", "Circa 14 litri", "Circa 28 litri"], "a": 3, "e": "L'acqua dentro le cellule è di circa 28 litri, cioè circa due terzi dell'acqua totale (42 L)."}, {"s": 52, "q": "A quanto ammonta il liquido extracellulare (ECF) nell'esempio della slide?", "o": ["3 litri", "28 litri", "14 litri", "42 litri"], "a": 2, "e": "Il liquido extracellulare è la parte rimanente dopo quella intracellulare: 42 − 28 = 14 litri, circa un terzo dell'acqua totale."}, {"s": 52, "q": "In quali sottocompartimenti si divide il liquido extracellulare?", "o": ["Plasma (3 L) e liquido interstiziale (11 L)", "Linfa e urina", "Plasma (11 L) e liquido interstiziale (3 L)", "Liquido intracellulare e plasma"], "a": 0, "e": "I 14 litri di liquido extracellulare si dividono in 3 litri di plasma e 11 litri di liquido interstiziale."}, {"s": 52, "q": "Che cos'è il liquido interstiziale?", "o": ["Il liquido in cui sono immerse le cellule dei tessuti", "L'urina", "Il liquido contenuto nei vasi sanguigni", "Il liquido contenuto dentro le cellule"], "a": 0, "e": "La slide lo definisce come il liquido in cui sono immerse le cellule dei nostri tessuti. Si trova fuori dalle cellule e fuori dai vasi."}, {"s": 52, "q": "Quale sigla indica il liquido interstiziale nella tabella?", "o": ["ECF", "TBW", "ICF", "ISF"], "a": 3, "e": "Le sigle della tabella sono: TBW acqua corporea totale, ICF intracellulare, ECF extracellulare, ISF liquido interstiziale (interstitial fluid)."}, {"s": 53, "q": "Quale esempio di evento perturbante dei compartimenti liquidi viene proposto nella slide?", "o": ["Il sonno", "Una ferita", "Un pasto abbondante", "Una maratona"], "a": 3, "e": "La slide usa la maratona come evento perturbante: gli equilibri tra i compartimenti liquidi vanno mantenuti anche in queste condizioni."}, {"s": 54, "q": "Nella maratona, perché si suda?", "o": ["Per aumentare il volume del plasma", "Per diminuire l'osmolarità del plasma", "Per assorbire sodio", "Per ridurre il calore, dato che la temperatura corporea aumenta"], "a": 3, "e": "Lo sforzo fa aumentare la temperatura corporea e la sudorazione serve a disperdere calore. È un meccanismo a feedback negativo di termoregolazione."}, {"s": 54, "q": "Che cosa si perde con il sudore durante la maratona?", "o": ["Solo acqua", "Solo soluti", "Solo proteine", "Sia acqua sia soluti, per esempio sodio"], "a": 3, "e": "La slide specifica che si perdono liquidi contenenti sia acqua sia soluti, come il sodio. In proporzione si perde però più acqua che soluti."}, {"s": 54, "q": "Perché durante la maratona aumenta l'osmolarità del plasma?", "o": ["Perché si perdono più soluti che acqua", "Perché i reni producono soluti", "Perché si beve troppa acqua", "Perché si perde più acqua che soluti"], "a": 3, "e": "Con il sudore si perde più acqua che soluti: i soluti rimasti sono sciolti in meno acqua, quindi l'osmolarità del plasma aumenta. È la condizione di disidratazione."}, {"s": 54, "q": "Cosa succede ai globuli rossi quando l'osmolarità del plasma aumenta per disidratazione?", "o": ["Non cambiano", "Esplodono", "Perdono acqua verso il plasma e si rimpiccioliscono", "Richiamano acqua e si gonfiano"], "a": 2, "e": "Il plasma diventa ipertonico rispetto alle cellule e attira acqua da esse: il globulo rosso si rimpicciolisce, come nell'esempio della soluzione ipertonica."}, {"s": 54, "q": "Che tipo di meccanismo è la sete, secondo la slide?", "o": ["Un meccanismo a feedback positivo", "Un riflesso che blocca la sudorazione", "Un trasporto attivo", "Uno dei primi meccanismi a feedback negativo che porta ad assumere acqua per correggere la perdita di liquidi"], "a": 3, "e": "La sete è descritta come uno dei primi meccanismi a feedback negativo: la perdita di liquidi genera lo stimolo a bere, che corregge la perdita."}, {"s": 54, "q": "Che rischio comporta bere acqua pura in grande quantità dopo una forte perdita di liquidi e sali?", "o": ["Diluizione del plasma e rigonfiamento cellulare", "Aumento dell'osmolarità del plasma", "Disidratazione cellulare", "Nessun rischio"], "a": 0, "e": "L'acqua pura viene rapidamente assorbita e diluisce il plasma, che diventa ipotonico rispetto alle cellule. L'acqua allora entra nelle cellule, che si rigonfiano. In condizioni estreme gli squilibri possono essere elevati."}, {"s": 54, "q": "Perché le bevande elettrolitiche sono preferibili all'acqua pura dopo una maratona?", "o": ["Perché contengono più acqua", "Perché aumentano la sudorazione", "Perché contengono elettroliti (sodio, potassio, magnesio) e reidratano senza diluire il plasma, mantenendo l'equilibrio osmotico", "Perché non vengono assorbite"], "a": 2, "e": "Le bevande elettrolitiche reintegrano sia acqua sia sali persi con il sudore: il plasma non viene diluito e si ottiene una reidratazione con mantenimento dell'equilibrio osmotico."}, {"s": 54, "q": "Dopo una grande assunzione di acqua pura, il plasma diventa rispetto alle cellule:", "o": ["Isotonico", "Ipotonico", "Impermeabile", "Ipertonico"], "a": 1, "e": "Diluendo il plasma, la sua concentrazione di soluti scende sotto quella delle cellule: il plasma diventa ipotonico e l'acqua tende a entrare nelle cellule."}, {"s": 56, "q": "La diffusione facilitata avviene:", "o": ["Solo per i gas", "Solo tramite vescicole", "Contro gradiente, consumando ATP", "Secondo gradiente, da dove la sostanza è più concentrata a dove lo è meno, senza consumo di energia"], "a": 3, "e": "La diffusione facilitata è un trasporto passivo: la sostanza passa secondo gradiente, dalla concentrazione alta a quella bassa, senza richiesta di energia."}, {"s": 56, "q": "In cosa differisce la diffusione facilitata dalla diffusione semplice?", "o": ["Consuma ATP", "Richiede un facilitatore, cioè una proteina di membrana, perché la sostanza non attraversa da sola la membrana", "Va contro gradiente", "Riguarda solo i gas"], "a": 1, "e": "Entrambe sono passive e secondo gradiente, ma nella facilitata le caratteristiche fisico-chimiche della sostanza non le permettono di attraversare il doppio strato: serve una proteina trasportatrice."}, {"s": 56, "q": "Chi sono tipicamente i trasportatori della diffusione facilitata?", "o": ["Fosfolipidi", "Molecole di ATP", "Vescicole", "Proteine di membrana"], "a": 3, "e": "La slide afferma che i trasportatori della diffusione facilitata sono tipicamente proteine di membrana, come la proteina trasportatrice del glucosio nella figura."}, {"s": 56, "q": "Quali sono le caratteristiche della diffusione facilitata elencate nella slide?", "o": ["Proporzionalità lineare illimitata", "Trasporto contro gradiente, consumo di ATP, non saturabilità", "Uso di vescicole, fagocitosi, pinocitosi", "Trasporto lungo gradiente, passività, uso di proteine trasportatrici, saturabilità, specificità chimica, competizione"], "a": 3, "e": "Le caratteristiche elencate sono sei: trasporto lungo gradiente, passività, utilizzo di proteine trasportatrici, saturabilità, specificità chimica e competizione."}, {"s": 56, "q": "Quale molecola viene usata come esempio di sostanza trasportata per diffusione facilitata?", "o": ["L'ossigeno", "L'anidride carbonica", "L'etanolo", "Il glucosio"], "a": 3, "e": "La figura mostra la proteina trasportatrice di glucosio: il glucosio è una grossa molecola polare che non attraversa il doppio strato e usa un trasportatore."}, {"s": 57, "q": "Come si comporta la proteina trasportatrice durante la diffusione facilitata?", "o": ["Oscilla continuamente tra una conformazione aperta verso l'esterno e una aperta verso l'interno", "Resta sempre aperta verso l'esterno", "È un poro sempre aperto su entrambi i lati", "Si apre solo quando riceve ATP"], "a": 0, "e": "Il trasportatore è sempre in movimento tra la condizione «aperto fuori» (a, b, e) e «aperto dentro» (c, d). Se durante questa oscillazione incontra la molecola da trasportare, la lega."}, {"s": 57, "q": "Che cosa determina la direzione del trasporto nella diffusione facilitata?", "o": ["La posizione del nucleo", "Il consumo di ATP", "Il gradiente di concentrazione", "La carica della proteina"], "a": 2, "e": "La direzione è secondo gradiente: la probabilità che il glucosio si leghi quando il trasportatore è aperto verso l'esterno dipende da quanto glucosio c'è dentro e fuori. Le proteine assistono in modo neutro il passaggio."}, {"s": 57, "q": "Perché si dice che i trasportatori della diffusione facilitata assistono il trasporto in modo «neutro»?", "o": ["Perché non legano la molecola", "Perché trasportano qualsiasi sostanza", "Perché non hanno carica", "Perché non impongono una direzione: il flusso netto segue solo il gradiente"], "a": 3, "e": "Il trasportatore lega la molecola da entrambi i lati; dove la concentrazione è maggiore, i legami sono più frequenti. Il flusso netto quindi va secondo gradiente, senza che la proteina spinga in una direzione."}, {"s": 57, "q": "Nella figura del trasportatore del glucosio, in quale fase il glucosio viene rilasciato all'interno?", "o": ["Nella fase (e)", "Nella fase (b)", "Nella fase (a)", "Nella fase (d), con il trasportatore aperto verso l'interno"], "a": 3, "e": "In (b) il glucosio si lega dal lato esterno, in (c) il trasportatore cambia conformazione e in (d), aperto verso l'interno, rilascia il glucosio nel liquido intracellulare."}, {"s": 58, "q": "Che cosa si intende per saturabilità nella diffusione facilitata?", "o": ["Il flusso aumenta senza limiti con il gradiente", "Oltre un certo gradiente il flusso non aumenta più, perché i trasportatori lavorano al massimo", "Il trasportatore si rompe ad alte concentrazioni", "La membrana si riempie di acqua"], "a": 1, "e": "Ogni trasportatore può trasportare solo una certa quantità di sostanza nell'unità di tempo. Quando tutti lavorano al massimo, anche aumentando il gradiente il flusso resta costante."}, {"s": 58, "q": "Qual è l'andamento grafico della diffusione facilitata in funzione del gradiente?", "o": ["Una curva che scende", "Una retta", "Un'iperbole che tende a un plateau", "Una parabola"], "a": 2, "e": "La slide indica: andamento della diffusione facilitata → IPERBOLE. Il flusso cresce all'inizio con il gradiente, poi raggiunge un plateau dovuto alla saturazione."}, {"s": 58, "q": "Perché il grafico della diffusione facilitata, a differenza di quello della diffusione semplice, raggiunge un plateau?", "o": ["Perché il numero di trasportatori è limitato e si saturano", "Perché si esaurisce l'ATP", "Perché la permeabilità del doppio strato si annulla", "Perché il gradiente si inverte"], "a": 0, "e": "La diffusione semplice non usa proteine, quindi il flusso cresce in modo lineare con il gradiente. La facilitata dipende da un numero finito di trasportatori: una volta saturati, il flusso non può aumentare."}, {"s": 58, "q": "Nel tratto iniziale del grafico della diffusione facilitata, il flusso:", "o": ["È zero", "Aumenta con l'aumentare del gradiente", "Resta costante", "Diminuisce"], "a": 1, "e": "All'inizio, con l'aumentare del gradiente, il flusso aumenta perché ci sono trasportatori liberi. Solo dopo la relazione si blocca e il flusso resta costante."}, {"s": 59, "q": "Che cosa si intende per specificità chimica del trasportatore?", "o": ["Il trasportatore trasporta solo ioni", "Il trasportatore funziona solo a 37 °C", "Il trasportatore lega qualunque molecola", "Il trasportatore lega una sostanza con cui ha affinità"], "a": 3, "e": "Il trasportatore lega solo sostanze con cui ha affinità: per esempio il trasportatore del glucosio trasporta glucosio e non amminoacidi."}, {"s": 59, "q": "Il trasportatore del glucosio può trasportare anche il galattosio. Perché?", "o": ["Perché il galattosio è molto simile al glucosio e la specificità non è assoluta", "Perché consuma ATP", "Perché il galattosio è uno ione", "Perché il galattosio è un gas"], "a": 0, "e": "La specificità può essere più o meno alta. Il galattosio ha una struttura molto simile a quella del glucosio e viene ugualmente trasportato dallo stesso trasportatore."}, {"s": 59, "q": "Il trasportatore per il glucosio trasporta gli amminoacidi?", "o": ["Solo se il glucosio è assente", "Sì, sempre", "No, per la specificità chimica", "Solo in presenza di ATP"], "a": 2, "e": "La slide usa proprio questo esempio: il trasportatore per il glucosio trasporta glucosio e non amminoacidi. È la specificità chimica."}, {"s": 59, "q": "A che cosa porta il fatto che la specificità non sia assoluta?", "o": ["Al trasporto contro gradiente", "All'aumento illimitato del flusso", "Alla competizione tra sostanze simili per lo stesso trasportatore", "Alla rottura del trasportatore"], "a": 2, "e": "Se sostanze simili (glucosio e galattosio) possono legarsi allo stesso trasportatore, esse competono tra loro per i siti di legame."}, {"s": 60, "q": "Quali due parametri determinano l'esito della competizione tra due sostanze per lo stesso trasportatore?", "o": ["Affinità e quantità", "Carica e massa", "Colore e forma", "Temperatura e pressione"], "a": 0, "e": "La slide indica: 1) affinità, cioè quale sostanza il trasportatore lega più facilmente; 2) quantità, cioè la concentrazione relativa delle due sostanze."}, {"s": 60, "q": "Se il galattosio è in rapporto 99:1 rispetto al glucosio, cosa trasporterà prevalentemente il trasportatore?", "o": ["Il galattosio", "Entrambi in parti uguali", "Il glucosio", "Nessuno dei due"], "a": 0, "e": "Anche se l'affinità può essere diversa, la quantità conta: con il galattosio enormemente più abbondante, il trasportatore lo incontrerà e lo trasporterà molto più spesso."}, {"s": 60, "q": "Nella competizione, che cosa indica l'affinità?", "o": ["La concentrazione della sostanza", "Il consumo di ATP", "La velocità della membrana", "Quanto facilmente il trasportatore lega una certa sostanza"], "a": 3, "e": "L'affinità indica la facilità con cui il trasportatore lega una sostanza. A parità di concentrazione, la sostanza con maggiore affinità viene trasportata di più."}, {"s": 62, "q": "Quali due casi di canali vengono trattati nelle slide?", "o": ["Canali per l'ATP e per l'ossigeno", "Canali per il glucosio e per gli amminoacidi", "Canali per le proteine e per i lipidi", "Canali per il passaggio di acqua e canali per il passaggio di ioni"], "a": 3, "e": "La slide presenta due casi: i canali per l'acqua (acquaporine) e i canali per gli ioni (canali ionici)."}, {"s": 63, "q": "Come si chiamano i canali attraverso cui passa l'acqua?", "o": ["Canali ionici", "Acquaporine", "Pompe ATPasi", "Clatrine"], "a": 1, "e": "L'acqua passa attraverso canali chiamati acquaporine: proteine con un poro centrale da cui passano le molecole d'acqua."}, {"s": 63, "q": "Com'è fatta un'acquaporina?", "o": ["È una proteina con un poro centrale, un canale, attraverso cui passano le molecole d'acqua", "È un fosfolipide modificato", "È una vescicola", "È un enzima che rompe l'ATP"], "a": 0, "e": "La slide descrive le acquaporine come proteine con un poro centrale che forma un canale percorribile dalle molecole d'acqua."}, {"s": 63, "q": "Il passaggio di acqua attraverso le acquaporine è:", "o": ["Attivo, con consumo di ATP", "Attivo secondario", "Passivo, governato dall'osmosi", "Mediato da vescicole"], "a": 2, "e": "Il passaggio è PASSIVO: è governato dall'osmosi. L'acqua segue il gradiente e si sposta dove ci sono più soluti che esercitano una forza attrattiva."}, {"s": 63, "q": "Perché tutte le membrane delle nostre cellule sono permeabili all'acqua?", "o": ["Perché tutte hanno pompe per l'acqua", "Perché sono prive di fosfolipidi", "Perché tutte possiedono acquaporine, in quantità diverse", "Perché l'acqua è carica"], "a": 2, "e": "La slide afferma che tutte le membrane cellulari hanno acquaporine, anche se in quantità diverse: per questo tutte sono permeabili all'acqua."}, {"s": 63, "q": "Quale ormone, a livello del rene, modifica la quantità di acquaporine per regolare la diuresi?", "o": ["ADH (ormone antidiuretico)", "Insulina", "Adrenalina", "Eritropoietina"], "a": 0, "e": "L'ADH, ormone antidiuretico, modifica la quantità di acquaporine nelle cellule renali: più acquaporine significano più acqua riassorbita e meno urina."}, {"s": 64, "q": "Di quale funzione sono alla base i canali ionici, secondo la slide?", "o": ["Il funzionamento del sistema nervoso", "La digestione delle proteine", "La produzione di eritrociti", "La sintesi dei fosfolipidi"], "a": 0, "e": "I canali ionici sono alla base del funzionamento del SN: i segnali nervosi sono correnti elettriche portate da ioni che entrano ed escono dalle cellule."}, {"s": 64, "q": "Perché sono possibili i segnali nervosi?", "o": ["Perché esistono correnti elettriche veicolate da ioni che si spostano dentro e fuori dalle cellule", "Perché l'acqua passa nelle acquaporine", "Perché il glucosio entra per diffusione facilitata", "Perché le cellule si dividono"], "a": 0, "e": "La slide spiega che i segnali nervosi sono correnti elettriche generate dallo spostamento di ioni attraverso i canali ionici."}, {"s": 64, "q": "In base a quali criteri si possono classificare i canali ionici?", "o": ["Meccanismi di apertura e chiusura, e selettività ionica", "Colore e dimensione", "Tipo di vescicola", "Numero di ATP consumati"], "a": 0, "e": "La slide indica due criteri: 1) i meccanismi di apertura e chiusura; 2) la selettività ionica, cioè quale ione passa."}, {"s": 65, "q": "Quali stimoli possono aprire o chiudere i canali ionici?", "o": ["Stimoli elettrici (voltaggio-dipendenti), meccanici e chimici", "Solo la temperatura", "Solo la luce", "Solo l'ATP"], "a": 0, "e": "La slide classifica i canali in base allo stimolo: elettrico (differenza di potenziale tra interno ed esterno), meccanico (per esempio lo stiramento della membrana) e chimico (una sostanza che interagisce con il canale)."}, {"s": 65, "q": "Come funziona un canale voltaggio-dipendente?", "o": ["È sempre aperto", "Si apre quando lega una sostanza chimica", "Si apre o chiude in base alla differenza di potenziale elettrico tra interno ed esterno della cellula", "Si apre quando la membrana viene stirata"], "a": 2, "e": "I canali voltaggio-dipendenti rispondono a stimoli elettrici: la loro apertura dipende dalla differenza di potenziale tra i due lati della membrana."}, {"s": 65, "q": "Un canale che si apre quando la membrana viene stirata è un esempio di canale:", "o": ["Voltaggio-dipendente", "Acquaporina", "Meccanico", "Chimico"], "a": 2, "e": "La slide cita proprio lo stiramento come esempio di stimolo meccanico: se la membrana viene stirata, il canale si apre."}, {"s": 65, "q": "Un canale che si apre in presenza di una particolare sostanza che interagisce con esso risponde a uno stimolo:", "o": ["Meccanico", "Termico", "Chimico", "Elettrico"], "a": 2, "e": "I canali che si aprono e chiudono quando una sostanza specifica si lega o interagisce con essi rispondono a stimoli chimici."}, {"s": 66, "q": "Che cosa significa classificare i canali in base alla selettività ionica?", "o": ["Classificarli in base allo ione che li attraversa: canali per sodio, potassio, calcio, ecc.", "Classificarli in base allo stimolo che li apre", "Classificarli in base al consumo di ATP", "Classificarli in base alla velocità"], "a": 0, "e": "Con la selettività ionica si classificano i canali in base a ciò che passa al loro interno: canali per il sodio, per il potassio, per il calcio e così via."}, {"s": 66, "q": "Nella figura della selettività ionica, quali ioni sono rappresentati?", "o": ["Solo H⁺", "Solo Cl⁻", "Glucosio e galattosio", "K⁺, Na⁺ e Ca²⁺"], "a": 3, "e": "La figura mostra canali per il potassio (K⁺), il sodio (Na⁺) e il calcio (Ca²⁺), ciascuno attraversato dal proprio ione."}, {"s": 68, "q": "Che cos'è una pompa di membrana?", "o": ["Una vescicola", "Una proteina di membrana che sposta sostanze contro gradiente consumando energia", "Una proteina che sposta sostanze solo secondo gradiente", "Un canale sempre aperto"], "a": 1, "e": "La pompa è una proteina di membrana che sposta sostanze contro gradiente, da dove sono meno concentrate a dove lo sono di più. Per farlo consuma energia a ogni ciclo."}, {"s": 68, "q": "Perché una pompa consuma energia a ogni ciclo?", "o": ["Perché sposta sostanze secondo gradiente", "Perché forma vescicole", "Perché sposta sostanze contro il loro gradiente", "Perché trasporta solo acqua"], "a": 2, "e": "Muovere una sostanza da bassa ad alta concentrazione va contro il movimento spontaneo: richiede energia, che la pompa ricava dall'ATP."}, {"s": 68, "q": "Come si chiama il trasporto in cui la stessa proteina rompe l'ATP e sposta la sostanza?", "o": ["Trasporto attivo secondario", "Osmosi", "Trasporto attivo primario", "Diffusione facilitata"], "a": 2, "e": "Quando la proteina usa l'energia in modo diretto, rompendo essa stessa l'ATP, si parla di trasporto attivo primario."}, {"s": 68, "q": "Perché le pompe vengono chiamate «ATPasi»?", "o": ["Perché producono ATP", "Perché sono in grado di rompere (idrolizzare) l'ATP", "Perché sono fatte di ATP", "Perché trasportano ATP"], "a": 1, "e": "Il suffisso -asi indica un enzima: la pompa ATPasi idrolizza l'ATP, ne ricava l'energia e la usa per spostare la sostanza."}, {"s": 68, "q": "Quale pompa viene citata come esempio di trasporto attivo primario?", "o": ["Il cotrasportatore sodio-glucosio", "L'acquaporina", "La pompa sodio-potassio ATPasi", "Il trasportatore GLUT del glucosio"], "a": 2, "e": "L'esempio citato è la pompa Na⁺/K⁺ ATPasi, che usa direttamente l'ATP per spostare sodio e potassio."}, {"s": 69, "q": "Dove è presente la pompa Na⁺/K⁺ ATPasi?", "o": ["Su tutte le membrane delle nostre cellule (è ubiquitaria)", "Solo nei globuli rossi", "Solo nei neuroni", "Solo nel rene"], "a": 0, "e": "La slide la definisce ubiquitaria: è presente su tutte le membrane delle nostre cellule."}, {"s": 69, "q": "Dove è più concentrato il sodio?", "o": ["In modo uguale dentro e fuori", "All'esterno della cellula", "All'interno della cellula", "Solo nel nucleo"], "a": 1, "e": "Il sodio è più concentrato all'esterno: circa 140-145 mEq/L extracellulari contro 10 mEq/L intracellulari."}, {"s": 69, "q": "Dove è più concentrato il potassio?", "o": ["Solo nel plasma", "In modo uguale dentro e fuori", "All'esterno della cellula", "All'interno della cellula"], "a": 3, "e": "Il potassio è più concentrato all'interno: circa 160 mEq/L intracellulari contro 4 mEq/L extracellulari."}, {"s": 69, "q": "Qual è la concentrazione intracellulare del potassio riportata nella tabella?", "o": ["140 mEq/L", "4 mEq/L", "10 mEq/L", "160 mEq/L"], "a": 3, "e": "La tabella indica 160 mEq/L di K⁺ intracellulare contro 4 mEq/L extracellulare."}, {"s": 69, "q": "Che cosa succederebbe se le concentrazioni di Na⁺ e K⁺ non fossero regolate con precisione?", "o": ["Aumento della produzione di eritropoietina", "Nessuna conseguenza", "Problemi a tutta l'eccitabilità delle cellule", "Blocco dell'osmosi"], "a": 2, "e": "La slide avverte che, senza una regolazione precisa di sodio e potassio, si avrebbero problemi a tutta l'eccitabilità cellulare, che si basa proprio sui gradienti di questi ioni."}, {"s": 70, "q": "Quali influenze perturbatrici agiscono sulle concentrazioni di Na⁺ e K⁺ nelle cellule eccitabili?", "o": ["L'ingresso di glucosio", "La fagocitosi", "L'ingresso di sodio e l'uscita di potassio durante i segnali nervosi", "L'ingresso di potassio e l'uscita di sodio"], "a": 2, "e": "Con l'attività dei neuroni il sodio entra e il potassio esce, seguendo i propri gradienti. A lungo andare questo cambierebbe le concentrazioni."}, {"s": 70, "q": "Perché i gradienti di Na⁺ e K⁺ non si dissipano nel tempo?", "o": ["Perché la membrana è impermeabile a questi ioni", "Perché il sodio non si muove", "Perché le acquaporine li trattengono", "Perché la pompa Na⁺/K⁺ è continuamente attiva e riporta fuori il sodio e dentro il potassio"], "a": 3, "e": "La pompa lavora di continuo, ributtando fuori il sodio entrato e dentro il potassio uscito: così i gradienti vengono mantenuti."}, {"s": 70, "q": "Nella figura della pompa Na⁺/K⁺, le frecce verdi rappresentano:", "o": ["Il lavoro della pompa contro gradiente", "La perturbazione lungo gradiente: sodio che entra e potassio che esce", "Il consumo di ATP", "Il passaggio d'acqua"], "a": 1, "e": "Le frecce verdi indicano i movimenti a favore di gradiente (perturbazione): il sodio tende a entrare e il potassio a uscire passivamente."}, {"s": 71, "q": "Nella figura della pompa Na⁺/K⁺, le frecce rosse indicano:", "o": ["Il trasporto contro gradiente operato dalla pompa", "L'ingresso di glucosio", "Il passaggio passivo a favore di gradiente", "Il flusso di acqua"], "a": 0, "e": "La slide precisa: la pompa sposta contro gradiente (freccia rossa), mentre la freccia verde è a favore di gradiente."}, {"s": 72, "q": "Quanti ioni sodio e quanti ioni potassio sposta la pompa Na⁺/K⁺ a ogni ciclo?", "o": ["3 Na⁺ escono e 2 K⁺ entrano", "2 Na⁺ escono e 3 K⁺ entrano", "3 Na⁺ entrano e 2 K⁺ escono", "1 Na⁺ esce e 1 K⁺ entra"], "a": 0, "e": "La pompa è asimmetrica: per ogni ciclo fa uscire 3 ioni sodio e fa entrare 2 ioni potassio."}, {"s": 72, "q": "Perché la pompa Na⁺/K⁺ viene definita asimmetrica?", "o": ["Perché funziona solo in una metà della cellula", "Perché sposta un numero diverso di ioni nelle due direzioni: 3 Na⁺ fuori e 2 K⁺ dentro", "Perché sposta solo cationi in una direzione", "Perché consuma due ATP per ciclo"], "a": 1, "e": "L'asimmetria sta nel rapporto 3:2. Escono più cariche positive di quante ne entrino, e questo contribuisce anche alla differenza di potenziale ai due lati della membrana."}, {"s": 72, "q": "Nel ciclo della pompa Na⁺/K⁺, in quale fase avviene la fosforilazione da ATP?", "o": ["Dopo il rilascio dei 2 K⁺ all'interno", "Prima del legame del sodio", "La pompa non usa ATP", "Dopo il legame dei 3 Na⁺ dal lato interno"], "a": 3, "e": "Nella figura, in (a) tre Na⁺ si legano dal lato interno; in (b) l'ATP fosforila la pompa (ATP → ADP + P), che cambia conformazione e in (c) rilascia il sodio all'esterno. In seguito legherà il potassio."}, {"s": 72, "q": "Nel ciclo della pompa Na⁺/K⁺, cosa avviene dopo il rilascio del sodio all'esterno?", "o": ["Si legano altri 3 Na⁺", "Si legano 2 K⁺ dal lato esterno, il fosfato si stacca e il potassio viene rilasciato all'interno", "Entra glucosio", "Si forma una vescicola"], "a": 1, "e": "Dopo il rilascio del sodio (c), la pompa lega 2 K⁺ dall'esterno (d), il gruppo fosfato si stacca, la pompa torna alla conformazione iniziale (e) e rilascia il potassio all'interno (f)."}, {"s": 74, "q": "Che tipo di trasporto sono i cotrasportatori e i controtrasportatori?", "o": ["Endocitosi", "Trasporti passivi semplici", "Meccanismi attivi secondari, non ATPasi", "Trasporti attivi primari"], "a": 2, "e": "La slide li definisce meccanismi attivi secondari: non sono ATPasi, non rompono direttamente l'ATP, ma sfruttano un gradiente già esistente."}, {"s": 74, "q": "Quante sostanze spostano contemporaneamente cotrasportatori e controtrasportatori?", "o": ["Una sola", "Tre", "Nessuna", "Sempre due: una contro gradiente e una lungo gradiente"], "a": 3, "e": "Spostano sempre due sostanze contemporaneamente: una si muove lungo il proprio gradiente e fornisce l'energia per spostare l'altra contro gradiente."}, {"s": 74, "q": "Che cosa si intende per cotrasporto o simporto?", "o": ["Il trasporto di due sostanze nella stessa direzione", "Il trasporto di una sola sostanza", "Il trasporto di due sostanze in direzioni opposte", "Il trasporto tramite vescicole"], "a": 0, "e": "Se le due sostanze vanno nella stessa direzione si parla di cotrasporto o simporto."}, {"s": 74, "q": "Che cosa si intende per controtrasporto o antiporto?", "o": ["Il trasporto di due sostanze nella stessa direzione", "La fagocitosi", "Il trasporto di due sostanze in direzioni opposte", "Il trasporto passivo di acqua"], "a": 2, "e": "Se le due sostanze si muovono in direzioni opposte, una entra e l'altra esce, si parla di controtrasporto o antiporto."}, {"s": 74, "q": "Perché il trasporto dei cotrasportatori è detto «secondario»?", "o": ["Perché usa l'energia del gradiente di una sostanza, gradiente creato a sua volta da un trasporto attivo primario", "Perché avviene dopo la diffusione semplice", "Perché consuma due ATP", "Perché è meno importante"], "a": 0, "e": "Il cotrasportatore non consuma ATP: usa l'energia del movimento secondo gradiente di una sostanza (per esempio il sodio). Quel gradiente è però mantenuto dalla pompa Na⁺/K⁺, che consuma ATP: l'energia è quindi usata in modo indiretto."}, {"s": 75, "q": "Nel cotrasportatore sodio-glucosio, come si muove il sodio?", "o": ["Contro gradiente", "Non si muove", "Lungo gradiente", "Viene pompato con ATP direttamente dal cotrasportatore"], "a": 2, "e": "Il Na⁺ si muove lungo il proprio gradiente, dall'esterno (concentrazione alta) all'interno (concentrazione bassa). È la freccia verde della figura."}, {"s": 75, "q": "Nel cotrasportatore sodio-glucosio, come si muove il glucosio?", "o": ["Lungo gradiente", "Contro gradiente", "Per osmosi", "Per diffusione semplice"], "a": 1, "e": "Il glucosio si muove contro gradiente (freccia rossa): può farlo perché il passaggio in discesa del sodio fornisce l'energia necessaria."}, {"s": 75, "q": "Il cotrasportatore sodio-glucosio è un esempio di:", "o": ["Controtrasporto (antiporto)", "Trasporto attivo primario", "Cotrasporto (simporto)", "Diffusione facilitata"], "a": 2, "e": "Sodio e glucosio entrano entrambi nella cellula, quindi nella stessa direzione: è un cotrasporto o simporto."}, {"s": 75, "q": "Qual è il principio di funzionamento del cotrasportatore sodio-glucosio?", "o": ["L'ATP sposta direttamente il glucosio", "Il passaggio in discesa del sodio lungo gradiente favorisce il passaggio in salita del glucosio", "L'acqua trascina il glucosio", "Il glucosio spinge fuori il sodio"], "a": 1, "e": "La slide lo riassume così: il passaggio in discesa del sodio lungo gradiente favorisce il passaggio in salita del glucosio, che richiede energia."}, {"s": 77, "q": "Perché le macromolecole hanno bisogno di endocitosi o esocitosi?", "o": ["Perché sono gas", "Perché sono idrofobiche", "Perché sono ioni piccoli", "Perché sono troppo grandi per attraversare la membrana anche con l'aiuto delle proteine trasportatrici"], "a": 3, "e": "Le macromolecole hanno dimensioni tali da non poter attraversare la membrana nemmeno con le proteine trasportatrici: possono farlo solo se inglobate in vescicole."}, {"s": 77, "q": "Che cos'è l'endocitosi?", "o": ["L'ingresso di molecole dal liquido extracellulare tramite vescicole che si formano dalla membrana plasmatica", "L'uscita di molecole tramite vescicole", "Il trasporto di ioni nei canali", "Il passaggio d'acqua nelle acquaporine"], "a": 0, "e": "Nell'endocitosi le molecole extracellulari entrano nella cellula tramite vescicole che si originano dalla membrana plasmatica, chiamate endosomi."}, {"s": 77, "q": "Come si chiamano le vescicole che si formano durante l'endocitosi?", "o": ["Ribosomi", "Lisosomi", "Endosomi", "Perossisomi"], "a": 2, "e": "La slide indica che le vescicole formate dalla membrana plasmatica nell'endocitosi sono denominate endosomi."}, {"s": 77, "q": "Che cos'è l'esocitosi?", "o": ["Il rilascio nel liquido interstiziale di macromolecole contenute in vescicole secretorie che si fondono con la membrana", "L'ingresso di particelle nella cellula", "Il passaggio di gas", "La digestione intracellulare"], "a": 0, "e": "Nell'esocitosi le macromolecole interne sono impacchettate in vescicole secretorie che, fondendosi con la membrana plasmatica, rilasciano il contenuto all'esterno."}, {"s": 78, "q": "Quali sono i tre tipi di endocitosi elencati?", "o": ["Fagocitosi, pinocitosi ed endocitosi mediata da recettore", "Osmosi, diffusione e filtrazione", "Esocitosi, secrezione ed escrezione", "Simporto, antiporto e uniporto"], "a": 0, "e": "La slide elenca fagocitosi (molecole grandi), pinocitosi (molecole piccole) ed endocitosi mediata da recettore (molecole specifiche riconosciute da recettori)."}, {"s": 79, "q": "Come avviene la fagocitosi?", "o": ["La membrana si invagina e cattura liquido extracellulare", "Un recettore lega una molecola specifica", "La cellula estende la membrana con movimenti ameboidi attorno a una particella e la ingloba in un fagosoma", "Una vescicola si fonde con la membrana e rilascia il contenuto"], "a": 2, "e": "Nella fagocitosi la cellula, con movimenti ameboidi, estende la membrana attorno a una particella; quando la circonda completamente, gli estremi si fondono formando il fagosoma nel citoplasma."}, {"s": 79, "q": "Che cosa si forma quando il fagosoma si fonde con un lisosoma?", "o": ["Un fagolisosoma", "Un endosoma", "Una vescicola secretoria", "Un ribosoma"], "a": 0, "e": "La fusione tra la membrana del fagosoma e quella di un lisosoma forma il fagolisosoma, dove enzimi frammentano la particella."}, {"s": 79, "q": "Perché il lisosoma viene definito il «sistema digerente della cellula»?", "o": ["Perché produce ATP", "Perché contiene il DNA", "Perché è responsabile della degradazione e digestione di molecole", "Perché sintetizza proteine"], "a": 2, "e": "Il lisosoma contiene enzimi che degradano e digeriscono molecole e particelle: nel fagolisosoma frammentano il materiale inglobato, consentendo di riutilizzare i composti utili."}, {"s": 79, "q": "In quali cellule avviene comunemente la fagocitosi?", "o": ["Nelle cellule muscolari scheletriche", "In alcuni tipi di globuli bianchi", "Negli osteociti", "Nei globuli rossi"], "a": 1, "e": "La fagocitosi è tipica di alcuni globuli bianchi, che rimuovono sostanze estranee e batteri dal nostro organismo."}, {"s": 80, "q": "Quali caratteristiche ha la pinocitosi?", "o": ["È altamente specifica e mediata da recettori", "La membrana si invagina, ingloba liquido extracellulare con soluti disciolti, avviene continuamente e non è specifica", "Richiede movimenti ameboidi", "Riguarda solo particelle grandi come batteri"], "a": 1, "e": "Nella pinocitosi la membrana si invagina e i margini si uniscono a formare una vescicola. Il contenuto è liquido extracellulare con soluti disciolti, piccole molecole che non richiedono processi elaborati di disgregazione. Avviene di continuo in molte cellule e non è specifica."}, {"s": 81, "q": "In cosa l'endocitosi mediata da recettore differisce dalla pinocitosi?", "o": ["È specifica: proteine di membrana agiscono da recettori che riconoscono e legano sostanze precise", "Riguarda solo l'acqua", "Avviene solo nei globuli bianchi", "Non forma vescicole"], "a": 0, "e": "Anche qui la membrana si invagina a formare una vescicola, come nella pinocitosi. La differenza è la specificità: recettori di membrana riconoscono e legano specifiche sostanze presenti nel fluido extracellulare."}, {"s": 81, "q": "Quale proteina riveste la «fossetta» nella figura dell'endocitosi mediata da recettore?", "o": ["L'emoglobina", "L'acquaporina", "La clatrina", "La pompa Na⁺/K⁺"], "a": 2, "e": "Nella figura le molecole legate ai recettori si concentrano in una fossetta rivestita di clatrina, che si invagina e forma la vescicola."}, {"s": 82, "q": "Quali sono le tre funzioni dell'esocitosi?", "o": ["Assorbire acqua, filtrare sangue, produrre urina", "Digerire batteri, produrre ATP, trasportare gas", "Aggiungere componenti alla membrana, riciclare recettori rimossi con l'endocitosi, secernere sostanze all'esterno", "Contrarre muscoli, condurre impulsi, sintetizzare DNA"], "a": 2, "e": "La slide elenca: 1) aggiungere componenti alla membrana plasmatica; 2) riciclare recettori rimossi con l'endocitosi; 3) secernere sostanze specifiche nell'ambiente extracellulare."}, {"s": 82, "q": "Perché l'esocitosi può aggiungere componenti alla membrana plasmatica?", "o": ["Perché la membrana della vescicola secretoria, fondendosi, diventa parte della membrana plasmatica", "Perché consuma acqua", "Perché produce fosfolipidi nel citoplasma", "Perché rimuove la membrana"], "a": 0, "e": "Qualunque componente presente nella membrana della vescicola viene aggiunto alla membrana plasmatica al momento della fusione: la cellula può così inserire proteine, fosfolipidi o carboidrati, o rimpiazzare membrana persa con l'endocitosi."}, {"s": 82, "q": "Quale dei seguenti è un esempio di secrezione per esocitosi citato nella slide?", "o": ["Ossigeno che entra nei globuli rossi", "Globuli bianchi che secernono anticorpi e cellule nervose ed endocrine che secernono messaggeri chimici", "Glucosio che entra con il sodio", "Acqua che passa nelle acquaporine"], "a": 1, "e": "La slide cita alcuni globuli bianchi che secernono anticorpi contro le infezioni, e cellule nervose ed endocrine che secernono messaggeri chimici per comunicare con altre cellule."}, {"s": 84, "q": "Che cos'è un tessuto epiteliale secondo la slide?", "o": ["Un insieme di cellule specifiche, fittamente addensate e legate orizzontalmente tra loro", "Un insieme di fibre muscolari", "Un tessuto privo di cellule", "Un insieme di cellule sparse in un liquido"], "a": 0, "e": "La slide definisce l'epitelio come cellule specifiche, fittamente addensate e legate «orizzontalmente» tra loro."}, {"s": 84, "q": "Quali conseguenze ha l'organizzazione delle cellule in epiteli?", "o": ["Separazione di ambienti e necessità di meccanismi per trasportare materiali", "Fusione di tutti i compartimenti", "Assenza di qualunque trasporto", "Solo produzione di calore"], "a": 0, "e": "Le cellule epiteliali legate tra loro separano ambienti diversi; di conseguenza servono meccanismi per trasportare materiali da un lato all'altro."}, {"s": 84, "q": "Che cosa si intende per assorbimento e secrezione nel trasporto epiteliale?", "o": ["Sono sinonimi", "Riguardano solo i gas", "Assorbimento: da interno a esterno; secrezione: da esterno a interno", "Assorbimento: da esterno a interno; secrezione: da interno a esterno"], "a": 3, "e": "La slide distingue l'assorbimento, dall'esterno all'interno, e la secrezione, dall'interno all'esterno."}, {"s": 85, "q": "Come si chiama lo strato di cellule che delimita i capillari?", "o": ["Endotelio", "Periostio", "Epidermide", "Mesotelio"], "a": 0, "e": "La slide dice che anche i più piccoli capillari sono delimitati da almeno uno strato di cellule, l'endotelio del capillare, che regola l'entrata e l'uscita delle sostanze."}, {"s": 85, "q": "Che effetto hanno le giunzioni tra le cellule epiteliali sulla membrana cellulare?", "o": ["Eliminano la membrana", "Permettono il libero passaggio di tutte le sostanze", "Rendono la membrana identica su tutti i lati", "Separano la parte di membrana rivolta da un lato (per esempio il lume) da quella rivolta dall'altro lato, che ha caratteristiche diverse"], "a": 3, "e": "Grazie alle giunzioni, la parte di membrana rivolta verso un lato (come il lume dello stomaco o del tubulo renale) è completamente separata da quella rivolta verso l'altro lato e ha caratteristiche diverse."}, {"s": 86, "q": "Come si chiama la membrana della cellula epiteliale rivolta verso il lume?", "o": ["Lamina basale", "Membrana apicale", "Membrana basolaterale", "Membrana nucleare"], "a": 1, "e": "Il lato rivolto verso il lume di una cavità corporea è la membrana apicale."}, {"s": 86, "q": "Come si chiama la membrana della cellula epiteliale rivolta verso l'ambiente interno e i vasi sanguigni?", "o": ["Membrana basolaterale", "Membrana mitocondriale", "Glicocalice", "Membrana apicale"], "a": 0, "e": "Il lato opposto al lume, in contatto con il liquido interstiziale e vicino ai vasi, è la membrana basolaterale, che poggia sulla lamina basale."}, {"s": 86, "q": "Su che cosa poggia la membrana basolaterale?", "o": ["Sulla lamina basale", "Sul lume", "Sulla membrana apicale", "Sui microvilli"], "a": 0, "e": "La slide indica che la membrana basolaterale poggia sulla lamina basale, oltre la quale ci sono il liquido interstiziale e i capillari."}, {"s": 87, "q": "Che cos'è il trasporto paracellulare?", "o": ["La fagocitosi", "Il passaggio attraverso la cellula, entrando da un lato e uscendo dall'altro", "Il trasporto tramite pompe", "Il passaggio di sostanze attraverso le giunzioni tra una cellula e l'altra"], "a": 3, "e": "Il trasporto paracellulare avviene tra le cellule, attraverso le giunzioni che le uniscono."}, {"s": 87, "q": "Che cos'è il trasporto transcellulare (o epiteliale)?", "o": ["Il passaggio attraverso la cellula, entrando da un lato ed uscendo dall'altro", "La secrezione di ormoni nel sangue", "Il passaggio d'acqua nei capillari", "Il passaggio tra le cellule attraverso le giunzioni"], "a": 0, "e": "Nel trasporto transcellulare la sostanza attraversa la cellula: entra da una membrana (per esempio apicale) ed esce dall'altra (basolaterale)."}, {"s": 87, "q": "Quale tipo di trasporto epiteliale riguarda la maggior parte delle sostanze?", "o": ["Il trasporto paracellulare", "Nessuno dei due", "Il trasporto transcellulare", "Solo la fagocitosi"], "a": 2, "e": "La maggior parte delle sostanze è trasportata per via transcellulare. Le giunzioni sono molto piccole e lasciano passare solo qualche ione e un po' d'acqua."}, {"s": 88, "q": "Che funzione hanno le giunzioni strette negli epiteli?", "o": ["Formano vescicole", "Limitano il passaggio di sostanze tra le cellule, permettendo ai liquidi ai due lati di avere composizione diversa", "Producono ATP", "Favoriscono il libero passaggio di tutte le sostanze"], "a": 1, "e": "Le giunzioni strette limitano il passaggio attraverso lo spazio tra le cellule: grazie a loro i liquidi ai due lati dello strato cellulare possono avere composizione diversa."}, {"s": 88, "q": "Che differenza c'è tra epiteli stretti ed epiteli lassi?", "o": ["Gli stretti sono più permeabili", "Gli stretti hanno giunzioni molto poco permeabili, i lassi giunzioni più permeabili", "Gli epiteli lassi non hanno giunzioni", "Non c'è differenza"], "a": 1, "e": "Il grado di adesione delle giunzioni varia da organo a organo: gli epiteli stretti hanno giunzioni poco permeabili, quelli lassi giunzioni più permeabili."}, {"s": 89, "q": "Nell'assorbimento intestinale di glucosio, come entrano sodio e glucosio attraverso la membrana apicale?", "o": ["Entrambi per diffusione semplice", "Tramite la pompa Na⁺/K⁺", "Tramite un cotrasportatore sodio/glucosio: il sodio secondo gradiente, il glucosio contro gradiente", "Per fagocitosi"], "a": 2, "e": "Sulla membrana apicale ci sono cotrasportatori sodio/glucosio: il Na⁺ entra passivamente secondo gradiente e trascina con sé il glucosio contro gradiente."}, {"s": 89, "q": "Come esce il glucosio dalla cellula intestinale verso il liquido interstiziale?", "o": ["Contro gradiente consumando ATP", "Per esocitosi", "Tramite la pompa Na⁺/K⁺", "Per diffusione facilitata attraverso la membrana basolaterale, secondo gradiente"], "a": 3, "e": "Il glucosio si è accumulato nella cellula ed è poco c e"], "a": 1, "e": "Le pompe trasportano soluti dall'intestino nel liquido interstiziale; questo crea un piccolo gradiente osmotico che richiama immediatamente acqua."}, {"s": 90, "q": "Basta un grande gradiente osmotico per richiamare acqua attraverso l'epitelio intestinale?", "o": ["L'acqua non risponde ai gradienti", "Serve ATP oltre al gradiente", "No: basta un minimo gradiente per provocare subito l'assorbimento di acqua", "Sì, serve sempre un gradiente enorme"], "a": 2, "e": "La slide dice che l'assorbimento dei soluti crea un minimo gradiente che provoca immediatamente l'assorbimento di acqua. È coerente con quanto visto sulle pressioni osmotiche: piccole differenze di concentrazione hanno effetti forti."}];
const L=["A","B","C","D"], N=Q.length, KEY="fisio-quiz-v1";
let st={i:0,ans:{}}, onlyWrong=false;
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.ans){st=s}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);

function order(){return onlyWrong?Q.map((_,k)=>k).filter(k=>st.ans[k]!==undefined&&st.ans[k]!==Q[k].a):Q.map((_,k)=>k)}

function render(){
  const q=Q[st.i], given=st.ans[st.i], done=given!==undefined;
  $("num").textContent=`Domanda ${st.i+1} di ${N}`;
  $("slide").textContent=`Slide ${q.s}`;
  $("q").textContent=q.q;
  const box=$("opts"); box.innerHTML="";
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML=`<span class="key">${L[k]}</span><span></span>`;
    b.lastChild.textContent=t;
    if(done){b.disabled=true;
      if(k===q.a)b.classList.add("ok"); else if(k===given)b.classList.add("ko"); else b.classList.add("dim");}
    else b.onclick=()=>answer(k);
    box.appendChild(b);
  });
  const ex=$("exp");
  if(done){const right=given===q.a;
    ex.hidden=false;
    ex.innerHTML=`<span class="verdict ${right?"ok":"ko"}"></span><p></p>`;
    ex.firstChild.textContent=right?"Risposta corretta.":`Risposta errata. Quella giusta è la ${L[q.a]}.`;
    ex.lastChild.textContent=q.e;
  } else ex.hidden=true;
  const ord=order(), pos=ord.indexOf(st.i);
  $("prev").disabled=onlyWrong?pos<=0:st.i===0;
  $("next").disabled=onlyWrong?(pos===-1||pos>=ord.length-1):st.i===N-1;
  $("jumpIn").value="";
  stats(); grid();
}

function answer(k){if(st.ans[st.i]!==undefined)return; st.ans[st.i]=k; save(); render();}

function stats(){
  let g=0,r=0; for(const k in st.ans){st.ans[k]===Q[k].a?g++:r++}
  const d=g+r;
  $("score").innerHTML=`<b>${g}</b> giuste · <b>${r}</b> sbagliate · ${N-d} da fare${d?`<br>${Math.round(g/d*100)}% di risposte corrette`:""}`;
  const bar=$("bar").children; bar[0].style.width=(g/N*100)+"%"; bar[1].style.width=(r/N*100)+"%";
  $("onlyWrong").disabled=r===0&&!onlyWrong;
}

function grid(){
  const gEl=$("grid"); if(gEl.hidden)return;
  gEl.innerHTML="";
  order().forEach(k=>{
    const c=document.createElement("button"); c.className="cell"; c.type="button"; c.textContent=k+1;
    const a=st.ans[k]; if(a!==undefined)c.classList.add(a===Q[k].a?"g":"r");
    if(k===st.i)c.classList.add("cur");
    c.title=`Domanda ${k+1} · slide ${Q[k].s}`;
    c.onclick=()=>go(k); gEl.appendChild(c);
  });
}

function go(k){if(k<0||k>=N)return; st.i=k; save(); render(); $("card").scrollIntoView({block:"nearest",behavior:"smooth"});}
function step(d){
  if(!onlyWrong){go(st.i+d);return}
  const ord=order(), pos=ord.indexOf(st.i);
  if(pos===-1){if(ord.length)go(ord[0]);return}
  const n=ord[pos+d]; if(n!==undefined)go(n);
}

$("prev").onclick=()=>step(-1);
$("next").onclick=()=>step(1);
$("jumpIn").addEventListener("keydown",e=>{if(e.key==="Enter"){const v=parseInt(e.target.value,10); if(v>=1&&v<=N)go(v-1)}});
$("jumpIn").addEventListener("change",e=>{const v=parseInt(e.target.value,10); if(v>=1&&v<=N)go(v-1)});
$("toggleGrid").onclick=e=>{const g=$("grid"); g.hidden=!g.hidden; e.target.setAttribute("aria-expanded",!g.hidden); e.target.textContent=g.hidden?"Mostra tutte le domande":"Nascondi griglia"; grid();};
$("onlyWrong").onclick=e=>{onlyWrong=!onlyWrong; e.target.setAttribute("aria-pressed",onlyWrong);
  const ord=order(); if(onlyWrong&&ord.length&&!ord.includes(st.i))st.i=ord[0]; render();};
$("nextOpen").onclick=()=>{for(let d=1;d<=N;d++){const k=(st.i+d)%N; if(st.ans[k]===undefined){go(k);return}}};
function resetUI(){
  const box=$("resetBox"); box.innerHTML='Cancellare tutte le risposte? <button class="btn" id="yes">Sì, ricomincia</button><button class="btn" id="no">Annulla</button>';
  $("yes").onclick=()=>{st={i:0,ans:{}}; onlyWrong=false; $("onlyWrong").setAttribute("aria-pressed","false"); save(); restore(); render();};
  $("no").onclick=restore;
}
function restore(){$("resetBox").innerHTML='<button class="btn" id="reset">Ricomincia</button>'; $("reset").onclick=resetUI;}
$("reset").onclick=resetUI;

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const k=e.key.toUpperCase(), m={"1":0,"2":1,"3":2,"4":3,A:0,B:1,C:2,D:3};
  if(k in m){answer(m[k]);e.preventDefault()}
  else if(e.key==="ArrowRight")step(1);
  else if(e.key==="ArrowLeft")step(-1);
});
render();
</script>

<style>

<script>
const Q=[{"s": 3, "q": "Come viene definita la fisiologia?", "o": ["La scienza che studia le malattie e le loro cause", "La scienza che descrive la forma e la posizione degli organi del corpo", "La scienza che classifica gli organismi viventi in specie e generi", "La scienza che studia il funzionamento degli organismi viventi applicando i principi della fisica e della chimica"], "a": 3, "e": "La fisiologia studia come funzionano gli organismi viventi e spiega questi funzionamenti usando le leggi della fisica e della chimica. La descrizione della forma e della posizione degli organi è invece compito dell'anatomia, lo studio delle malattie è la patologia e la classificazione degli organismi è la tassonomia."}, {"s": 3, "q": "Quali discipline vengono indicate come basi su cui poggia la fisiologia?", "o": ["Farmacologia, microbiologia, genetica e immunologia", "Psicologia, sociologia, filosofia ed etica", "Fisica, chimica, biologia e anatomia", "Matematica, statistica, informatica e logica"], "a": 2, "e": "La slide colloca la fisiologia all'incrocio di fisica, chimica, biologia e anatomia: per capire una funzione bisogna conoscere la struttura (anatomia), i fenomeni della vita (biologia) e le leggi fisico-chimiche che governano i processi, come diffusione, pressioni e reazioni."}, {"s": 3, "q": "Per studiare gli organismi, secondo la fisiologia, è necessario comprenderne:", "o": ["Solo la composizione chimica dei tessuti", "Soltanto la distribuzione geografica", "Esclusivamente la storia evolutiva", "L'organizzazione gerarchica"], "a": 3, "e": "La slide afferma che studiare gli organismi significa comprenderne l'organizzazione gerarchica: cellule, tessuti, organi, sistemi. Ogni livello poggia sul precedente e ne aggiunge funzioni nuove, per cui la composizione chimica da sola non basta."}, {"s": 4, "q": "Qual è l'ordine corretto dei livelli gerarchici di un organismo, dal più semplice al più complesso?", "o": ["Tessuti → cellule → organi → sistemi", "Organi → tessuti → cellule → apparati", "Cellule → tessuti → organi → sistemi o apparati", "Cellule → organi → tessuti → sistemi"], "a": 2, "e": "Le cellule formano i tessuti; i tessuti sono organizzati in organi; gli organi collaborano tra loro formando sistemi o apparati, che svolgono funzioni superiori. È l'ordine crescente di complessità mostrato nella slide."}, {"s": 4, "q": "Che cosa fanno le cellule nell'organizzazione gerarchica dell'organismo?", "o": ["Formano direttamente gli apparati senza livelli intermedi", "Collaborano per formare le cellule figlie", "Sono organizzate in sistemi senza passare per i tessuti", "Formano i tessuti"], "a": 3, "e": "Nello schema della slide le cellule «formano» i tessuti. È il primo passaggio della gerarchia: insiemi di cellule simili per struttura e funzione costituiscono un tessuto, il quale a sua volta entra nella costruzione degli organi."}, {"s": 4, "q": "Secondo lo schema gerarchico, gli organi:", "o": ["Sono le unità più piccole della vita", "Sono indipendenti tra loro e non interagiscono", "Formano le cellule", "Collaborano insieme per svolgere funzioni superiori formando sistemi o apparati"], "a": 3, "e": "La slide dice che gli organi collaborano insieme per svolgere funzioni superiori, formando sistemi o apparati. L'unità più piccola della vita è invece la cellula, e gli organi non lavorano isolati: è proprio la loro interazione a generare funzioni complesse."}, {"s": 4, "q": "I tessuti, nella gerarchia dell'organismo, sono:", "o": ["Il livello più alto dell'organizzazione", "Organizzati direttamente in cellule", "Organizzati in organi", "Componenti delle singole molecole"], "a": 2, "e": "Nello schema i tessuti «sono organizzati» in organi. Un organo è infatti formato da più tipi di tessuto che lavorano insieme (per esempio il cuore contiene tessuto muscolare, connettivo, nervoso ed epiteliale)."}, {"s": 5, "q": "Nell'esempio dell'apparato cardio-circolatorio, da cosa è rappresentato l'apparato?", "o": ["Solo dal cuore", "Solo dal sangue", "Dal cuore e anche dall'insieme di tutti i vasi", "Solo dalle arterie"], "a": 2, "e": "La slide sottolinea che l'apparato cardio-circolatorio non è solo il cuore, ma il cuore più l'insieme di tutti i vasi. Il cuore spinge il sangue, i vasi lo distribuiscono: entrambi sono indispensabili per la funzione."}, {"s": 5, "q": "Perché cuore e vasi vanno considerati insieme?", "o": ["Perché uno senza l'altro non può svolgere la funzione di far circolare il sangue", "Perché si trovano nella stessa cavità corporea", "Perché sono costituiti dallo stesso tessuto", "Perché sono controllati solo dal rene"], "a": 0, "e": "Il messaggio della slide è funzionale: un cuore senza vasi non farebbe circolare nulla, e dei vasi senza pompa non avrebbero flusso. La funzione di circolazione nasce solo dall'interazione delle due componenti."}, {"s": 5, "q": "Qual è il principio generale illustrato dall'esempio cuore–vasi?", "o": ["I livelli gerarchici sono indipendenti", "Le funzioni superiori dipendono solo dalle cellule nervose", "A ogni livello gli elementi interagiscono tra loro permettendo il realizzarsi di una funzione superiore", "Ogni organo svolge da solo una funzione completa"], "a": 2, "e": "La frase evidenziata in rosso nella slide recita che, a ogni livello, gli elementi hanno un'interazione tra loro che consente il realizzarsi di una funzione superiore. È il concetto chiave dell'organizzazione gerarchica: il tutto fa qualcosa che le singole parti non fanno."}, {"s": 6, "q": "Quale funzione viene usata come esempio di interazione tra sistemi?", "o": ["La produzione di ormoni sessuali", "La digestione delle proteine", "La contrazione volontaria dei muscoli", "L'adeguato apporto di O₂ alle cellule"], "a": 3, "e": "L'esempio guida delle slide 6–9 è l'adeguato apporto di ossigeno alle cellule (rifornimento di O₂). Serve a mostrare che una sola funzione richiede la collaborazione di rene, midollo osseo, polmoni, muscoli, intestino, cuore e sistema nervoso."}, {"s": 6, "q": "Dove vengono prodotti gli eritrociti (globuli rossi)?", "o": ["Nei polmoni", "Nel fegato dell'adulto", "Nel rene", "Nel midollo osseo"], "a": 3, "e": "Gli eritrociti sono prodotti nel midollo osseo. La slide usa questo dato per mostrare che anche l'apparato scheletrico, che contiene il midollo, partecipa al rifornimento di ossigeno alle cellule."}, {"s": 6, "q": "Come si chiama l'ormone che stimola il midollo osseo a produrre eritrociti?", "o": ["Adrenalina", "Insulina", "Eritropoietina", "Ormone antidiuretico (ADH)"], "a": 2, "e": "L'eritropoietina (EPO) è l'ormone che stimola il midollo osseo a produrre globuli rossi. Insulina regola la glicemia, ADH regola il riassorbimento di acqua nel rene, adrenalina è un ormone dello stress: nessuno di questi ha come bersaglio principale l'eritropoiesi."}, {"s": 6, "q": "Quale organo produce l'eritropoietina?", "o": ["Il cuore", "La milza", "Il midollo osseo", "Il rene"], "a": 3, "e": "Secondo la slide l'eritropoietina è prodotta a livello del rene. Il rene quindi, oltre a filtrare il sangue, partecipa indirettamente al trasporto di ossigeno regolando quanti globuli rossi vengono prodotti."}, {"s": 6, "q": "Che cosa succede se l'apporto di eritropoietina si riduce?", "o": ["Si riducono gli eritrociti e si va incontro ad anemia", "Aumentano gli eritrociti e il sangue diventa più denso", "Si riduce la frequenza respiratoria", "Aumenta la produzione di urina"], "a": 0, "e": "Meno eritropoietina significa minore stimolo al midollo osseo, quindi meno globuli rossi prodotti. La riduzione degli eritrociti è una condizione di anemia, in cui il sangue trasporta meno ossigeno."}, {"s": 6, "q": "Perché l'esempio dell'ossigeno coinvolge l'apparato scheletrico?", "o": ["Perché i muscoli respiratori sono ossa", "Perché il midollo osseo, contenuto nelle ossa, produce gli eritrociti", "Perché le ossa producono eritropoietina", "Perché le ossa immagazzinano ossigeno"], "a": 1, "e": "Gli eritrociti, che trasportano l'ossigeno, nascono nel midollo osseo, che si trova dentro le ossa. Per questo la slide afferma che anche l'apparato scheletrico è necessario per fornire ossigeno alle cellule."}, {"s": 7, "q": "Quale apparato serve per «caricare» di ossigeno gli eritrociti?", "o": ["L'apparato digerente", "L'apparato tegumentario", "L'apparato urinario", "L'apparato respiratorio"], "a": 3, "e": "Gli eritrociti si caricano di ossigeno nei polmoni, quindi serve l'apparato respiratorio. È il punto 4 della catena descritta nella slide."}, {"s": 7, "q": "Di cosa ha bisogno l'apparato respiratorio per gonfiare e sgonfiare i polmoni?", "o": ["Del midollo osseo", "Delle ghiandole sudoripare", "Dei muscoli respiratori", "Dei reni"], "a": 2, "e": "I polmoni non si espandono da soli: la ventilazione è prodotta dai muscoli respiratori (diaframma e intercostali). Per questo la slide inserisce i muscoli nella catena dell'apporto di ossigeno."}, {"s": 7, "q": "Quale apparato fornisce energia ai muscoli respiratori nell'esempio dell'ossigeno?", "o": ["Il midollo osseo", "Il rene", "Il sistema nervoso", "Il sistema gastrointestinale"], "a": 3, "e": "I muscoli respiratori devono essere continuamente riforniti di energia. Entra in gioco l'apparato gastrointestinale, che processa le sostanze ingerite e fornisce i substrati energetici ai muscoli."}, {"s": 7, "q": "Nell'esempio dell'ossigeno, qual è il ruolo dell'apparato gastrointestinale?", "o": ["Processare le sostanze ingerite e fornire energia ai muscoli", "Produrre eritropoietina", "Caricare di ossigeno il sangue", "Regolare la quantità di ossigeno inviata ai tessuti"], "a": 0, "e": "La slide spiega che l'apparato gastrointestinale processa ciò che mangiamo e fornisce energia ai muscoli, inclusi quelli respiratori. Senza questo rifornimento i muscoli non potrebbero ventilare i polmoni."}, {"s": 8, "q": "Quale sistema sposta continuamente gli eritrociti dai polmoni ai tessuti e viceversa?", "o": ["Il sistema cardiovascolare", "Il sistema linfatico", "Il sistema endocrino", "Il sistema nervoso"], "a": 0, "e": "Gli eritrociti vanno fatti circolare tra polmoni e tessuti: questo è compito del sistema cardiovascolare, cioè cuore e vasi, come indicato al punto 7 della slide."}, {"s": 8, "q": "Qual è il ruolo del sistema nervoso nell'esempio dell'apporto di ossigeno?", "o": ["Regolazione di alto livello: inviare tanto ossigeno quanto ne serve realmente a quel tessuto in quel momento", "Digerire le sostanze nutritive", "Caricare l'ossigeno sugli eritrociti", "Produrre i globuli rossi"], "a": 0, "e": "Il sistema nervoso svolge la regolazione di alto livello: adegua l'apporto di ossigeno al fabbisogno reale di ciascun tessuto in ogni momento. Non produce cellule né scambia gas, ma coordina gli altri sistemi."}, {"s": 8, "q": "Perché è necessaria una regolazione di alto livello dell'ossigeno?", "o": ["Perché l'ossigeno è tossico in qualsiasi quantità", "Perché gli eritrociti si muovono solo su comando volontario", "Perché i polmoni non funzionano senza ordini del cervello", "Perché il fabbisogno di ossigeno di ogni tessuto varia nel tempo"], "a": 3, "e": "La slide specifica che si deve mandare tanto ossigeno quanto ne è realmente necessario per quel tessuto in quel momento. Il fabbisogno cambia (per esempio un muscolo in esercizio consuma molto più ossigeno che a riposo), quindi serve un controllo che adegui l'apporto."}, {"s": 9, "q": "Quale delle seguenti strutture NON compare nello schema riassuntivo dell'apporto di ossigeno?", "o": ["Il cuore", "Il sistema nervoso", "Il pancreas endocrino", "Il rene"], "a": 2, "e": "Lo schema finale (slide 9) include rene, eritropoietina, midollo osseo, polmoni, muscoli, sistema gastrointestinale, cuore, sistema nervoso ed eritrociti. Il pancreas endocrino non viene nominato."}, {"s": 9, "q": "Qual è la conclusione dello schema riassuntivo sull'apporto di O₂?", "o": ["Il rene è l'unico organo coinvolto", "Una singola funzione richiede la cooperazione di molti sistemi diversi", "L'ossigeno dipende solo dai polmoni", "Ogni sistema lavora in modo indipendente dagli altri"], "a": 1, "e": "Lo schema mostra che per una funzione apparentemente semplice, portare ossigeno alle cellule, cooperano rene, midollo osseo, polmoni, muscoli, intestino, cuore e sistema nervoso. È l'esempio concreto del principio dell'interazione tra livelli e sistemi."}, {"s": 11, "q": "Da quali radici greche deriva il termine «omeostasi»?", "o": ["Omo- (uomo) e -stasi (arresto)", "Omo- (tutto) e -stasi (movimento)", "Omeo- (simile) e -stasi (stabilità)", "Omeo- (calore) e -stasi (sangue)"], "a": 2, "e": "Omeostasi deriva dal greco ὅμοιος, cioè «simile», e -stasi, cioè «stabilità». Il significato complessivo è quindi «stessa stabilità»: mantenere condizioni interne simili nel tempo."}, {"s": 11, "q": "Qual è il significato letterale di «omeostasi» secondo la slide?", "o": ["Arresto del flusso", "Equilibrio termico", "Movimento continuo", "Stessa stabilità"], "a": 3, "e": "Unendo omeo- (simile) e -stasi (stabilità), la slide traduce omeostasi come «stessa stabilità». Il termine richiama l'idea di mantenere costante l'ambiente interno."}, {"s": 11, "q": "Che cos'è l'omeostasi?", "o": ["La tendenza dell'organismo ad adattarsi all'ambiente cambiando il proprio ambiente interno", "La capacità di produrre energia dagli alimenti", "La tendenza a mantenere un ambiente interno stabile nonostante influenze perturbatrici esterne e interne", "L'assenza totale di variazioni nell'organismo"], "a": 2, "e": "L'omeostasi è la tendenza al mantenimento di un ambiente interno stabile nonostante le influenze perturbatrici provenienti sia dall'esterno sia dall'interno. Non significa assenza di variazioni, ma loro correzione per restare entro limiti adeguati."}, {"s": 11, "q": "Secondo la slide, le influenze perturbatrici provengono:", "o": ["Solo dalle malattie", "Solo dall'ambiente esterno", "Sia dall'ambiente esterno sia da quello interno", "Solo dall'ambiente interno"], "a": 2, "e": "La slide dice che nell'ambiente esterno ed interno dell'organismo sono continuamente presenti influenze perturbatrici. L'esempio esterno è la neve (freddo), ma anche processi interni come il metabolismo possono alterare l'equilibrio."}, {"s": 11, "q": "Quale esempio di influenza perturbatrice viene citato nella slide sull'omeostasi?", "o": ["La neve, cioè il freddo esterno", "Un'infezione batterica", "Un pasto abbondante", "Una ferita"], "a": 0, "e": "La slide usa l'immagine della neve e di una finestra aperta: il freddo che entra tende ad abbassare la temperatura, rappresentata da un termometro. È un esempio di perturbazione esterna che l'organismo deve contrastare."}, {"s": 11, "q": "Quale affermazione sull'omeostasi è corretta?", "o": ["L'omeostasi riguarda solo il sangue", "Esistono diverse variabili che perturbano l'equilibrio e diversi «sistemi» da mantenere in equilibrio", "L'omeostasi è garantita senza alcun meccanismo di controllo", "Esiste un'unica variabile da regolare, la temperatura"], "a": 1, "e": "La slide precisa che le variabili perturbanti sono molte e che sono molti anche i sistemi da mantenere in equilibrio (temperatura, glicemia, concentrazioni ioniche, volumi di liquidi, ecc.). Ognuno richiede meccanismi di controllo dedicati."}, {"s": 11, "q": "Nell'immagine della slide sull'omeostasi, cosa simboleggia la finestra aperta con la neve?", "o": ["Una perturbazione esterna che tende ad abbassare la temperatura", "L'ingresso di sostanze nutritive", "L'eliminazione delle scorie", "Un meccanismo di feedback positivo"], "a": 0, "e": "La finestra aperta con il fiocco di neve e la freccia verso il termometro indicano che il freddo esterno tende a far scendere la temperatura. È l'esempio di influenza perturbatrice a cui l'omeostasi deve rispondere."}, {"s": 12, "q": "A quali livelli può essere applicato il concetto di omeostasi?", "o": ["A livello microscopico (singola cellula) e macroscopico (intero organismo)", "Solo a livello dell'intero organismo", "Solo a livello molecolare", "Solo a livello di popolazione"], "a": 0, "e": "La slide indica due livelli: microscopico, cioè la singola cellula, e macroscopico, cioè l'intero organismo. In entrambi i casi serve prendere sostanze dall'esterno ed eliminarne altre per restare in equilibrio."}, {"s": 13, "q": "In che cosa consiste l'omeostasi a livello micro?", "o": ["Nel mantenere costante la temperatura corporea", "Nel controllare la frequenza cardiaca", "Nel mantenere entro un range la concentrazione delle sostanze all'interno della singola cellula", "Nel regolare la pressione arteriosa"], "a": 2, "e": "A livello micro l'omeostasi è il mantenimento della concentrazione delle varie sostanze nella singola cellula entro un range: se sono troppe vanno espulse, se sono poche vanno assunte dall'esterno, così la cellula resta in un ambiente costante."}, {"s": 13, "q": "Che cosa fa la cellula se una sostanza al suo interno è in eccesso?", "o": ["La accumula indefinitamente", "La trasforma sempre in ATP", "La espelle", "Si divide"], "a": 2, "e": "Secondo la slide, se le sostanze sono troppe si devono espellere; se sono poche si devono assumere dall'esterno. Questo scambio continuo mantiene la cellula in un ambiente costante."}, {"s": 13, "q": "Quali sostanze entrano nella cellula secondo lo schema dell'omeostasi micro?", "o": ["CO₂ e scorie", "Solo proteine", "Solo ioni sodio", "O₂, H₂O e sostanze nutritive"], "a": 3, "e": "Nello schema, le frecce in entrata indicano ossigeno, acqua e sostanze nutritive, ciò di cui la cellula ha bisogno per funzionare. CO₂ e scorie sono invece le sostanze in uscita."}, {"s": 13, "q": "Quali sostanze escono dalla cellula secondo lo schema dell'omeostasi micro?", "o": ["O₂ e acqua", "CO₂ e scorie", "Sostanze nutritive", "Glucosio e amminoacidi"], "a": 1, "e": "La cellula produce anidride carbonica e prodotti di scarto del metabolismo, che devono essere eliminati. Nello schema sono indicati dalla freccia rossa in uscita."}, {"s": 13, "q": "Qual è lo scopo finale dell'omeostasi a livello della singola cellula?", "o": ["Mantenere la cellula in un ambiente costante", "Bloccare ogni scambio con l'esterno", "Far crescere la cellula all'infinito", "Aumentare continuamente la concentrazione interna di nutrienti"], "a": 0, "e": "La frase in rosso della slide recita: mantenere la cellula in un ambiente costante. Gli scambi di entrata e uscita servono a questo, non a bloccare gli scambi né ad accumulare sostanze."}, {"s": 14, "q": "Nello schema dell'omeostasi a livello macro, che cosa rappresenta il rettangolo?", "o": ["L'ambiente esterno", "L'organismo, cioè l'ambiente interno", "Il sistema nervoso", "Una singola cellula"], "a": 1, "e": "Nella figura il rettangolo rappresenta l'organismo, cioè l'ambiente interno. All'esterno del rettangolo c'è l'ambiente esterno da cui si prendono e verso cui si eliminano le sostanze."}, {"s": 14, "q": "Quali funzioni principali sono rappresentate nello schema dell'omeostasi macro?", "o": ["Solo l'apparato locomotore", "Solo il sistema nervoso e quello endocrino", "Solo l'apparato riproduttivo", "Tubo digerente, apparato respiratorio, cardio-circolatorio e funzione renale"], "a": 3, "e": "Lo schema mostra il tratto gastrointestinale, i polmoni, il cuore e i vasi sanguigni, e i reni con filtrazione del sangue ed eliminazione delle scorie con l'urina, oltre alle cellule dei tessuti con i loro scambi."}, {"s": 14, "q": "Sotto quali forme l'organismo elimina le sostanze secondo la slide sull'omeostasi macro?", "o": ["Solo saliva", "Solo aria espirata", "Feci, urine e sudore", "Solo lacrime"], "a": 2, "e": "Come la cellula, l'organismo deve eliminare alcune sostanze: la slide cita feci, urine e sudore. Nella figura sono indicati il materiale non assorbito del tratto intestinale e l'urina prodotta dai reni."}, {"s": 14, "q": "Che cosa deve prendere l'organismo dall'esterno secondo la slide sull'omeostasi macro?", "o": ["Solo CO₂", "Solo acqua distillata", "Ossigeno e sostanze nutritive", "Solo calore"], "a": 2, "e": "Come la singola cellula, anche l'organismo intero deve prendere sostanze dall'esterno: ossigeno attraverso i polmoni e sostanze nutritive attraverso il tratto gastrointestinale."}, {"s": 14, "q": "Quale sistema regola tutte le funzioni rappresentate nello schema dell'omeostasi macro?", "o": ["Il sistema tegumentario", "Il sistema linfatico", "L'apparato scheletrico", "Il sistema nervoso (SN)"], "a": 3, "e": "La parentesi in alto nella slide indica che il SN regola tutte queste funzioni. Il sistema nervoso coordina respirazione, circolazione, digestione ed escrezione per mantenere l'equilibrio."}, {"s": 14, "q": "In che cosa l'omeostasi macro somiglia a quella micro?", "o": ["In entrambi i casi è coinvolto solo il rene", "In entrambi i casi bisogna prendere sostanze dall'esterno ed eliminarne altre", "In entrambi i casi l'unica variabile è la temperatura", "In entrambi i casi non ci sono scambi con l'esterno"], "a": 1, "e": "La slide dice «come per la cellula»: anche l'organismo deve prendere sostanze dall'esterno (ossigeno, nutrienti) ed eliminarne altre (feci, urine, sudore). Il principio di scambio per mantenere l'equilibrio è lo stesso ai due livelli."}, {"s": 14, "q": "Nello schema macro, che cosa avviene tra il sangue e il tubulo renale?", "o": ["Solo assorbimento di nutrienti", "Filtrazione, riassorbimento e secrezione", "Solo digestione", "Solo scambio di gas"], "a": 1, "e": "Nella figura, tra vasi sanguigni e reni sono indicati filtrazione, riassorbimento e secrezione, che portano alla produzione di urina. È la funzione renale di filtrazione del sangue ed eliminazione delle scorie."}, {"s": 15, "q": "Con quali meccanismi l'organismo mantiene l'omeostasi?", "o": ["Esclusivamente con l'assunzione di farmaci", "Meccanismi di feedback (retroazione)", "Con la riproduzione cellulare", "Solo meccanismi di trasporto passivo"], "a": 1, "e": "La slide risponde alla domanda «come fa l'organismo a mantenere l'omeostasi?» indicando i meccanismi di feedback, detti anche di retroazione: il risultato di un'azione viene rilevato e usato per correggere l'azione stessa."}, {"s": 15, "q": "Nella slide sull'omeostasi, il feedback positivo è scritto tra parentesi. Perché?", "o": ["Perché il feedback positivo riguarda solo le piante", "Perché il feedback positivo non esiste", "Perché il feedback positivo è il meccanismo più importante", "Perché il meccanismo principale dell'omeostasi è il feedback negativo, mentre il positivo va in direzione opposta all'omeostasi"], "a": 3, "e": "Il feedback negativo è il meccanismo cardine dell'omeostasi perché corregge le deviazioni. Il feedback positivo, come spiega la slide 25, amplifica la variazione iniziale e va nella direzione opposta all'omeostasi: per questo è segnalato tra parentesi."}, {"s": 17, "q": "Che cosa caratterizza un meccanismo a feedback negativo?", "o": ["All'aumentare della variabile si attivano meccanismi che la aumentano ulteriormente", "La variabile non viene mai controllata", "All'aumentare della variabile si attivano meccanismi che tendono a ridurla", "La variabile viene mantenuta sempre a zero"], "a": 2, "e": "Nel feedback negativo il risultato dell'azione ha un effetto opposto rispetto alla variazione iniziale: se la variabile aumenta, si attivano meccanismi per ridurla; se diminuisce, per aumentarla. Così la variabile torna verso il valore desiderato."}, {"s": 17, "q": "Nel feedback negativo, il risultato dell'azione ha un effetto:", "o": ["Casuale", "Opposto rispetto a quello iniziale", "Uguale e rafforzativo rispetto a quello iniziale", "Nullo"], "a": 1, "e": "La slide lo dice in modo esplicito: il risultato dell'azione ha un effetto opposto rispetto a quello iniziale. È per questo che si chiama negativo: inverte il segno della deviazione."}, {"s": 17, "q": "Quali esempi di feedback negativo cita la slide?", "o": ["Parto e coagulazione", "Digestione e respirazione", "Fagocitosi e pinocitosi", "Regolazione della temperatura corporea e della glicemia"], "a": 3, "e": "La slide cita la regolazione della temperatura corporea e della glicemia come esempi di feedback negativo. Parto e coagulazione sono invece gli esempi di feedback positivo della slide 25."}, {"s": 17, "q": "Qual è l'effetto del feedback negativo sulle variazioni a breve termine?", "o": ["Non ha alcun effetto su di esse", "Tende ad amplificarle", "Le rende permanenti", "Tende a mantenerle al minimo"], "a": 3, "e": "Secondo la slide il feedback negativo tende a mantenere al minimo le variazioni a breve termine: appena la variabile si discosta dal valore desiderato, la risposta la riporta indietro, limitando l'ampiezza delle oscillazioni."}, {"s": 17, "q": "Se la glicemia sale dopo un pasto, un meccanismo a feedback negativo:", "o": ["Attiva risposte che la fanno salire ancora", "Non interviene", "Blocca l'assorbimento intestinale per sempre", "Attiva risposte che la riportano verso il valore normale"], "a": 3, "e": "La glicemia è uno degli esempi di feedback negativo citati: un aumento della variabile attiva meccanismi volti a ridurla (per esempio la secrezione di insulina che favorisce l'ingresso di glucosio nelle cellule), riportandola verso il valore normale."}, {"s": 17, "q": "Quale differenza principale distingue feedback negativo e positivo?", "o": ["Il negativo si oppone alla variazione, il positivo la amplifica", "Non c'è alcuna differenza", "Il negativo riguarda solo gli ormoni, il positivo solo i nervi", "Il negativo amplifica la variazione, il positivo la riduce"], "a": 0, "e": "Confrontando le slide 17 e 25: nel feedback negativo il risultato ha un effetto opposto alla variazione iniziale e mantiene l'omeostasi; nel positivo il risultato rafforza l'effetto iniziale e va in direzione opposta all'omeostasi."}, {"s": 18, "q": "Nel grafico della regolazione della temperatura, cosa succede alla temperatura ambientale?", "o": ["Scende bruscamente da 30 °C a 15 °C", "Resta costante a 37 °C", "Oscilla continuamente", "Sale da 15 °C a 30 °C"], "a": 0, "e": "Il grafico superiore mostra la temperatura ambientale che passa improvvisamente da 30 °C a 15 °C. È la perturbazione esterna che mette alla prova il sistema di termoregolazione."}, {"s": 18, "q": "Quale valore di temperatura corporea rappresenta il set point nel grafico?", "o": ["15 °C", "37 °C", "30 °C", "36 °C"], "a": 1, "e": "Il set point è il valore desiderato della variabile, indicato dalla linea tratteggiata a 37 °C. Quando la temperatura corporea se ne discosta nasce il segnale di errore."}, {"s": 18, "q": "Che cosa si intende per «errore» nel feedback negativo?", "o": ["La differenza tra situazione attuale e situazione desiderata", "L'assenza di risposta del sistema", "Un malfunzionamento del sensore", "Un'infezione"], "a": 0, "e": "La slide definisce l'errore come situazione attuale ≠ situazione desiderata. Nel grafico è rappresentato dalle frecce tra la curva della temperatura corporea e il set point: più la temperatura è lontana da 37 °C, più l'errore è grande."}, {"s": 18, "q": "Nel grafico, dopo il calo della temperatura ambientale, la temperatura corporea:", "o": ["Scende fino a circa 36 °C e poi risale gradualmente fino al set point", "Scende a 15 °C", "Resta sempre a 37 °C senza variazioni", "Sale oltre i 38 °C"], "a": 0, "e": "La curva mostra un calo iniziale fino a circa 36 °C, poi una risalita graduale fino a 37 °C. Il calo genera l'errore, il meccanismo di regolazione si attiva e la temperatura torna alla normalità."}, {"s": 18, "q": "Come varia il segnale di errore mentre la temperatura corporea risale verso 37 °C?", "o": ["Aumenta progressivamente", "Resta costante", "Si inverte di segno e cresce", "Diminuisce progressivamente"], "a": 3, "e": "Nello schema a blocchi: la temperatura corporea aumenta e il segnale di errore diminuisce. Nel grafico le frecce dell'errore si accorciano man mano che la curva si avvicina al set point, fino ad annullarsi."}, {"s": 18, "q": "Qual è la sequenza corretta della regolazione della temperatura secondo lo schema a blocchi?", "o": ["Si attiva la regolazione → la temperatura scende → l'errore aumenta → la temperatura resta bassa", "Segnale di errore → temperatura normale → diminuisce → si attiva la regolazione", "Temperatura normale → aumenta → si blocca la regolazione → temperatura ambientale scende", "Temperatura normale → diminuisce e si innesca il segnale di errore → si attiva la regolazione → la temperatura aumenta e l'errore diminuisce → torna alla normalità"], "a": 3, "e": "Lo schema in alto nella slide segue esattamente questa sequenza in cinque passaggi. È il ciclo tipico del feedback negativo: perturbazione, errore, risposta correttiva, riduzione dell'errore, ritorno al set point."}, {"s": 19, "q": "Quali componenti sono necessari a un sistema a feedback negativo, qualunque sia la variabile controllata?", "o": ["Pompe, canali e trasportatori", "Sensori, integratori ed effettori", "Solo effettori", "Solo sensori"], "a": 1, "e": "La slide elenca tre elementi necessari: sensori che rilevano la variabile, integratori che la confrontano con il valore desiderato, effettori che generano la risposta. Senza uno solo di questi il ciclo di controllo non funziona."}, {"s": 20, "q": "Qual è il ruolo dei sensori nel feedback negativo?", "o": ["Confrontare la variabile con il set point", "Produrre la risposta correttiva", "Eliminare le scorie", "Rilevare la variabile e generare il segnale di input che indica la condizione attuale"], "a": 3, "e": "I sensori sono i rilevatori della variabile: generano il segnale di input del sistema, informando sullo stato attuale dell'organismo. Il confronto è compito dell'integratore, la risposta degli effettori."}, {"s": 20, "q": "Nell'esempio della termoregolazione, quali sono i sensori?", "o": ["I muscoli scheletrici", "Le ghiandole sudoripare", "I recettori per il caldo e per il freddo", "L'ipotalamo"], "a": 2, "e": "Nella figura i sensori sono i recettori per il caldo e per il freddo (termocettori). L'ipotalamo è l'integratore, mentre ghiandole sudoripare, vasi cutanei e muscoli sono effettori."}, {"s": 20, "q": "Nella figura della termoregolazione, quale area dell'ipotalamo è associata alla dissipazione del calore?", "o": ["L'area posteriore", "L'ipofisi", "L'area preottica", "Il talamo"], "a": 2, "e": "Nella figura l'area preottica è indicata con «dissipazione del calore», mentre l'area posteriore con «conservazione del calore». L'ipofisi è disegnata ma non è un centro termoregolatore."}, {"s": 20, "q": "Nella figura della termoregolazione, quale area dell'ipotalamo è associata alla conservazione del calore?", "o": ["L'area posteriore", "L'area preottica", "Il talamo", "L'ipofisi"], "a": 0, "e": "La figura indica l'area posteriore dell'ipotalamo come responsabile della conservazione del calore, collegata alle risposte al freddo (vasocostrizione, brivido). L'area preottica gestisce invece la dissipazione."}, {"s": 21, "q": "Qual è il ruolo degli integratori nel feedback negativo?", "o": ["Produrre sudore", "Confrontare le informazioni dei sensori con il valore da mantenere e, se c'è differenza, generare il segnale di errore", "Contrarre i muscoli", "Rilevare direttamente la temperatura"], "a": 1, "e": "Gli integratori ricevono l'input dai sensori e lo paragonano al valore che dovrebbe essere mantenuto costante. Se rilevano una differenza generano il segnale di errore, che porta a mettere in atto una risposta."}, {"s": 21, "q": "Quale struttura è citata come esempio di integratore nella termoregolazione?", "o": ["Il cervelletto", "Il talamo", "L'ipotalamo", "Il midollo osseo"], "a": 2, "e": "La slide indica l'ipotalamo come integratore di informazioni: paragona le informazioni ricevute dai sensori con il valore da mantenere. Nella figura il talamo è visibile ma non svolge questo ruolo."}, {"s": 21, "q": "Dove si trovano le strutture integratrici del feedback negativo secondo la slide?", "o": ["Nella pelle", "Nei muscoli", "A livello del sistema nervoso", "Nel midollo osseo"], "a": 2, "e": "La slide afferma che le informazioni di input devono essere integrate da strutture a livello del SN, come l'ipotalamo. Il sistema nervoso centrale è il centro di confronto e decisione del circuito."}, {"s": 22, "q": "Qual è il ruolo degli effettori nel feedback negativo?", "o": ["Conservare le informazioni in memoria", "Rilevare la variabile", "Confrontare la variabile con il set point", "Generare una risposta opposta alla variazione che ha attivato il sistema"], "a": 3, "e": "Gli effettori sono i generatori di risposte: ricevono i segnali di uscita dal SN e producono un comportamento opposto a quello che ha attivato il sistema, riportando la variabile verso il valore desiderato."}, {"s": 22, "q": "Nella figura della termoregolazione, cosa rappresentano le frecce spesse?", "o": ["Le informazioni in entrata (input)", "Il passaggio di calore", "Le informazioni in uscita (output)", "Il flusso di sangue"], "a": 0, "e": "La slide chiarisce che le frecce spesse rappresentano le informazioni in entrata, cioè i segnali dai sensori verso l'ipotalamo. Le frecce sottili rappresentano invece le informazioni in uscita verso gli effettori."}, {"s": 22, "q": "Nella figura della termoregolazione, cosa rappresentano le frecce sottili?", "o": ["Le informazioni in entrata dai sensori", "Le informazioni in uscita verso gli effettori", "Il flusso di sudore", "La conduzione nervosa sensitiva"], "a": 1, "e": "Le frecce sottili sono le informazioni in uscita dal SN dirette agli organi effettori: vasodilatazione o vasocostrizione cutanea, traspirazione, brivido."}, {"s": 22, "q": "Quali risposte effettrici sono associate alla dissipazione del calore nella figura?", "o": ["Brivido e traspirazione", "Vasocostrizione e brivido", "Vasocostrizione e traspirazione", "Vasodilatazione cutanea e traspirazione"], "a": 3, "e": "Per disperdere calore l'organismo dilata i vasi della cute, portando più sangue in superficie a scambiare calore, e attiva la traspirazione (sudore) che raffredda per evaporazione."}, {"s": 22, "q": "Quali risposte effettrici sono associate alla conservazione e produzione di calore nella figura?", "o": ["Vasodilatazione e traspirazione", "Vasodilatazione e brivido", "Vasocostrizione e brivido", "Traspirazione e brivido"], "a": 2, "e": "Al freddo i vasi cutanei si restringono (vasocostrizione), riducendo la perdita di calore, e i muscoli producono brividi, contrazioni involontarie che generano calore."}, {"s": 23, "q": "Nell'esempio di feedback negativo, quale sequenza di verbi descrive il funzionamento?", "o": ["Paragono → genero → rilevo", "Rilevo → genero → paragono", "Rilevo → paragono → genero", "Genero → rilevo → paragono"], "a": 2, "e": "La slide sintetizza così: RILEVO la riduzione della temperatura come input; PARAGONO e ottengo il segnale di errore; GENERO un aumento della temperatura aumentando la produzione di calore. Corrisponde a sensori, integratori, effettori."}, {"s": 23, "q": "Nell'esempio della slide, che cosa viene rilevato come segnale di input?", "o": ["Un aumento della pressione", "Una riduzione della temperatura", "Una riduzione dell'ossigeno", "Un aumento della glicemia"], "a": 1, "e": "L'esempio di questa slide è il freddo: il segnale di input è la riduzione della temperatura corporea, rilevata dai termocettori."}, {"s": 23, "q": "Nell'esempio della slide, quale risposta viene generata per correggere il calo di temperatura?", "o": ["Riduzione della produzione di calore", "Aumento della produzione di calore nell'organismo", "Aumento della sudorazione", "Vasodilatazione cutanea"], "a": 1, "e": "La risposta generata è un aumento della temperatura ottenuto aumentando la produzione di calore nell'organismo (e riducendone la perdita). Sudorazione e vasodilatazione servirebbero invece a disperdere calore."}, {"s": 24, "q": "Nello schema della risposta al freddo, quali sono i tre tipi di effettori?", "o": ["Fegato, pancreas e intestino", "Ipotalamo, talamo e ipofisi", "Reni, polmoni e cuore", "Ghiandole sudoripare, vasi sanguigni cutanei e muscoli scheletrici"], "a": 3, "e": "Lo schema mostra tre effettori: 1) ghiandole sudoripare, che riducono il sudore; 2) vasi sanguigni cutanei, che si restringono; 3) muscoli scheletrici, che producono brividi."}, {"s": 24, "q": "Perché al freddo si riduce la sudorazione?", "o": ["Per risparmiare sodio", "Perché le ghiandole sudoripare si congelano", "Per aumentare il volume del plasma", "Per evitare la dispersione di calore, dato che la sudorazione è un sistema efficace per disperdere calore"], "a": 3, "e": "La slide spiega che la sudorazione è un sistema efficace per disperdere il calore. Al freddo l'obiettivo è conservarlo, quindi si diminuisce la produzione di sudore."}, {"s": 24, "q": "Perché al freddo si ha vasocostrizione cutanea?", "o": ["Per aumentare la sudorazione", "Per aumentare la pressione osmotica", "Per portare più ossigeno alla pelle", "Per ridurre il sangue che scorre in superficie, che altrimenti scambierebbe calore con l'esterno"], "a": 3, "e": "Il sangue che scorre in superficie scambia calore con l'esterno. Restringendo i vasi cutanei si riduce il flusso ematico superficiale e quindi la perdita di calore."}, {"s": 24, "q": "Perché i brividi aiutano a contrastare il freddo?", "o": ["Perché nella contrazione muscolare una parte dell'energia viene dissipata in calore", "Perché bloccano la sudorazione", "Perché riducono il flusso di sangue alla pelle", "Perché aumentano la perdita di calore"], "a": 0, "e": "I brividi sono contrazioni muscolari involontarie. Ogni contrazione muscolare libera una parte dell'energia sotto forma di calore, che contribuisce a riscaldare il corpo."}, {"s": 24, "q": "Nello schema della risposta al freddo, cosa è il «feedback negativo» indicato dalla freccia tratteggiata?", "o": ["La produzione di sudore", "L'aumento della temperatura corporea che riduce lo stimolo iniziale", "L'ingresso dell'input nei centri cerebrali", "Il calo della temperatura ambientale"], "a": 1, "e": "La freccia tratteggiata parte dall'aumento della temperatura corporea e torna alla variabile regolata: il risultato della risposta annulla la causa che l'ha attivata. È proprio questo ritorno, opposto alla variazione iniziale, il feedback negativo."}, {"s": 24, "q": "Nello schema, l'effetto complessivo di ridotta sudorazione e vasocostrizione è:", "o": ["Un aumento della produzione di calore", "Una riduzione della perdita di calore", "Una riduzione della temperatura corporea", "Un aumento della perdita di calore"], "a": 1, "e": "Entrambi convergono su «perdita di calore ↓». Il brivido agisce invece sull'altro ramo, la produzione di calore ↑. Insieme portano a un aumento della temperatura corporea."}, {"s": 25, "q": "Che cosa caratterizza un meccanismo a feedback positivo?", "o": ["All'aumentare della variabile si attivano meccanismi volti ad aumentarne gli effetti", "La variabile viene mantenuta costante", "All'aumentare della variabile si attivano meccanismi che la riducono", "La variabile viene azzerata"], "a": 0, "e": "Nel feedback positivo il risultato dell'azione rafforza l'effetto iniziale: la variazione viene amplificata invece che corretta. È l'opposto del feedback negativo."}, {"s": 25, "q": "Quali sono gli esempi di feedback positivo citati nella slide?", "o": ["Il parto e la coagulazione", "La diffusione e l'osmosi", "La termoregolazione e la glicemia", "La sudorazione e il brivido"], "a": 0, "e": "La slide cita il parto e la coagulazione. In entrambi i casi un processo, una volta avviato, si autoalimenta fino a concludersi (espulsione del feto, formazione del coagulo)."}, {"s": 25, "q": "In che rapporto si trova il feedback positivo con l'omeostasi?", "o": ["È identico al feedback negativo", "Non ha alcuna relazione con le variabili fisiologiche", "Va nella direzione opposta all'omeostasi", "È il principale meccanismo dell'omeostasi"], "a": 2, "e": "La slide afferma che il feedback positivo è un meccanismo opposto, che va nella direzione opposta all'omeostasi: invece di riportare la variabile al set point, la allontana ulteriormente."}, {"s": 25, "q": "Nel feedback positivo, il risultato dell'azione:", "o": ["Inverte sempre la variabile", "Non modifica l'effetto iniziale", "Rafforza l'effetto iniziale", "Annulla l'effetto iniziale"], "a": 2, "e": "Il feedback positivo amplifica: il risultato rafforza lo stimolo che lo ha prodotto. Nel parto, per esempio, le contrazioni aumentano la pressione del feto sul collo dell'utero, che a sua volta stimola contrazioni più forti."}, {"s": 27, "q": "Rispetto a che cosa ogni cellula ha un ambiente leggermente diverso?", "o": ["Solo rispetto al sangue", "Rispetto a nulla: tutte le cellule hanno lo stesso ambiente", "Rispetto all'ambiente di cellule di altri tessuti e rispetto all'ambiente extracellulare", "Solo rispetto all'ambiente esterno all'organismo"], "a": 2, "e": "La slide elenca due confronti: l'ambiente di ogni cellula è leggermente diverso da quello di cellule appartenenti ad altri tessuti e da quello extracellulare. Questa diversità va mantenuta."}, {"s": 27, "q": "Che cosa permette di mantenere la diversità di composizione dei liquidi biologici?", "o": ["La sola pressione arteriosa", "Le membrane cellulari dotate di meccanismi che regolano tipo e quantità di sostanze che entrano o escono", "La temperatura corporea", "L'assenza di scambi tra le cellule"], "a": 1, "e": "Le cellule sono delimitate da membrane che devono possedere meccanismi capaci di regolare tipologia e quantità delle sostanze in entrata e in uscita. Questi sono i meccanismi di trasporto."}, {"s": 27, "q": "Che cosa regolano i meccanismi di trasporto?", "o": ["La divisione cellulare", "Il colore dei tessuti", "La sintesi delle proteine nel nucleo", "Gli scambi di sostanze tra interno ed esterno della cellula"], "a": 3, "e": "La conclusione della slide è che per regolare gli scambi di sostanze tra interno ed esterno della cellula esistono i meccanismi di trasporto."}, {"s": 27, "q": "Nella figura della slide sui meccanismi di trasporto, quali compartimenti separa la membrana?", "o": ["Il lume intestinale e il sangue", "Il nucleo e il citoplasma", "Il compartimento extracellulare e quello intracellulare", "Il plasma e la linfa"], "a": 2, "e": "La figura mostra una proteina inserita nella membrana con l'indicazione «compartimento extracellulare» sopra e «compartimento intracellulare» sotto: la membrana plasmatica separa l'interno della cellula dall'esterno."}, {"s": 28, "q": "Da quali molecole sono costituite principalmente le membrane cellulari?", "o": ["Acidi nucleici", "Fosfolipidi", "Trigliceridi", "Polisaccaridi"], "a": 1, "e": "Le membrane sono costituite da fosfolipidi, disposti in un doppio strato, in cui sono inserite proteine. Polisaccaridi, acidi nucleici e trigliceridi non ne sono il costituente strutturale principale."}, {"s": 28, "q": "Da che cosa è formata la parte idrofobica di un fosfolipide?", "o": ["Da una catena di amminoacidi", "Da due lunghe catene di acidi grassi", "Da un gruppo fosfato", "Dal glicerolo e dalla colina fosfato"], "a": 1, "e": "La parte idrofobica è costituita da due lunghe catene di acidi grassi, le «code» apolari. Glicerolo e colina fosfato formano invece la testa polare idrofilica."}, {"s": 28, "q": "Da che cosa è formata la parte idrofilica del fosfolipide descritto nella slide?", "o": ["Da glucosio", "Da colesterolo", "Da due catene di acidi grassi", "Da uno scheletro di glicerolo e dalla colina fosfato"], "a": 3, "e": "La testa polare (idrofilica) è formata dallo scheletro di glicerolo e dalla colina fosfato. Essendo polare, interagisce con l'acqua."}, {"s": 28, "q": "Come viene descritta la forma del fosfolipide nella slide?", "o": ["Un anello aromatico", "Una sfera interamente polare", "Una «forcina» con una parte polare idrofilica e una parte apolare idrofobica", "Una catena lineare interamente apolare"], "a": 2, "e": "La slide paragona il fosfolipide a una «forcina»: una testa polare (idrofilica) da cui partono due code apolari (idrofobiche). Questa doppia natura lo rende anfipatico."}, {"s": 28, "q": "Quale funzione hanno le proteine inserite nel doppio strato lipidico, secondo la slide?", "o": ["Hanno varie funzioni tra cui consentire il passaggio di sostanze", "Producono i fosfolipidi", "Bloccano qualunque scambio", "Servono solo a dare colore alla cellula"], "a": 0, "e": "All'interno del doppio strato sono inserite diverse proteine con varie funzioni che consentono, tra le altre cose, il passaggio di sostanze. Sono la base di canali, trasportatori e pompe."}, {"s": 28, "q": "Come sono disposti i fosfolipidi nella membrana?", "o": ["In un doppio strato con le teste polari rivolte verso l'esterno e le code apolari verso l'interno", "In modo casuale", "In un doppio strato con le code rivolte verso l'acqua", "In un singolo strato con le code rivolte verso l'acqua"], "a": 0, "e": "La figura mostra il doppio strato: le teste polari sono a contatto con l'acqua (extracellulare e citoplasma), mentre le code apolari si affrontano al centro della membrana, lontano dall'acqua."}, {"s": 29, "q": "Quali categorie di sostanze attraversano liberamente il doppio strato lipidico?", "o": ["Solo ioni", "Gas, molecole idrofobiche e piccole molecole polari", "Grosse molecole polari e molecole cariche", "Solo proteine"], "a": 1, "e": "Secondo la slide passano i gas (O₂, CO₂), le molecole idrofobiche (benzene) e le piccole molecole polari (acqua, etanolo). Le grosse molecole polari e le molecole cariche invece non passano."}, {"s": 29, "q": "Quali categorie di sostanze NON attraversano il doppio strato lipidico?", "o": ["Piccole molecole polari", "O₂ e CO₂", "Gas e molecole idrofobiche", "Grosse molecole polari e molecole cariche"], "a": 3, "e": "La slide indica in rosso le sostanze che non passano: grosse molecole polari (glucosio, amminoacidi) e molecole cariche (H⁺, Na⁺, Cl⁻, Ca²⁺). Per loro servono proteine o vescicole."}, {"s": 29, "q": "In quale categoria rientra il benzene nella slide?", "o": ["Molecole cariche che non passano", "Grosse molecole polari", "Gas che non passano", "Molecole idrofobiche che passano"], "a": 3, "e": "Il benzene è una molecola idrofobica (apolare): si scioglie facilmente nella parte lipidica della membrana e quindi la attraversa."}, {"s": 29, "q": "In quale categoria rientra il glucosio nella slide?", "o": ["Gas", "Piccole molecole polari che passano", "Grosse molecole polari che non passano", "Molecole idrofobiche"], "a": 2, "e": "Il glucosio è una grossa molecola polare e, secondo la slide, non attraversa il doppio strato lipidico. Per entrare nella cellula ha bisogno di proteine trasportatrici."}, {"s": 29, "q": "Gli ioni H⁺, Na⁺, Cl⁻ e Ca²⁺ appartengono a quale categoria nella slide?", "o": ["Molecole idrofobiche che passano", "Gas che passano", "Piccole molecole polari che passano", "Molecole cariche che non passano"], "a": 3, "e": "Sono ioni, cioè particelle cariche. La carica impedisce loro di attraversare il centro idrofobico della membrana: per questo nella slide sono tra le sostanze che non passano."}, {"s": 29, "q": "L'acqua, secondo la slide 29, viene classificata come:", "o": ["Molecola idrofobica", "Grossa molecola polare che non passa", "Piccola molecola polare che passa", "Molecola carica"], "a": 2, "e": "L'acqua è indicata tra le piccole molecole polari che attraversano la membrana. Più avanti (slide 63) si vedrà che il suo passaggio è molto favorito anche dalle acquaporine."}, {"s": 30, "q": "Quali sono le due possibilità per spostare le sostanze che non attraversano il doppio strato?", "o": ["Solo il calore oppure la luce", "Proteine di membrana oppure endocitosi/esocitosi", "Solo l'osmosi", "Solo la diffusione semplice"], "a": 1, "e": "La slide indica due strade: 1) proteine che creano un ambiente, diverso da quello lipidico, adatto al passaggio; 2) i meccanismi di esocitosi ed endocitosi, che usano vescicole."}, {"s": 30, "q": "Come aiutano le proteine il passaggio delle sostanze che non attraversano il doppio strato?", "o": ["Rompono la membrana", "Creano un ambiente, diverso da quello della membrana, adatto al passaggio", "Neutralizzano tutte le cariche dell'organismo", "Trasformano la sostanza in un gas"], "a": 1, "e": "La slide dice che le proteine consentono di creare un ambiente, che non è quello della membrana, adatto al passaggio delle sostanze. Un canale o un trasportatore offre una via non idrofobica a ioni e molecole polari."}, {"s": 30, "q": "Che cosa avviene quando un meccanismo di trasporto richiede energia?", "o": ["La cellula consuma ossigeno senza ATP", "La cellula consuma ATP, rompendo un gruppo fosforico con liberazione di energia", "La cellula usa la luce", "La cellula assorbe calore dall'esterno"], "a": 1, "e": "I meccanismi che richiedono energia consumano ATP: la rottura del legame con un gruppo fosforico libera energia che viene usata per il trasporto. La slide la descrive come reazione esotermica (termodinamicamente si parla di reazione che libera energia, esoergonica)."}, {"s": 30, "q": "I meccanismi di trasporto per le sostanze che non passano possono essere:", "o": ["Solo spontanei", "Né spontanei né energetici", "Solo richiedenti energia", "Spontanei oppure richiedenti energia"], "a": 3, "e": "La slide distingue a) meccanismi spontanei, b) meccanismi che richiedono energia sotto forma di ATP. È la base della classificazione in trasporti passivi e attivi."}, {"s": 31, "q": "Il trasporto di molecole attraverso le membrane segue gli stessi principi di:", "o": ["La genetica mendeliana", "Le reazioni chimiche", "La gravità", "L'elettromagnetismo"], "a": 1, "e": "La slide afferma che il trasporto attraverso le membrane segue gli stessi principi delle reazioni chimiche: i movimenti spontanei vanno da alta a bassa energia, quelli opposti richiedono energia."}, {"s": 31, "q": "In quale direzione avvengono i movimenti spontanei (passivi)?", "o": ["Sempre dall'esterno verso l'interno", "Da regioni a bassa energia verso regioni ad alta energia", "Da regioni ad alta energia verso regioni a bassa energia", "Sempre dall'interno verso l'esterno"], "a": 2, "e": "I movimenti spontanei o passivi avvengono da regioni ad alta energia verso regioni a bassa energia, proprio come una reazione chimica spontanea che libera energia."}, {"s": 31, "q": "Che cosa serve per muovere molecole da regioni a bassa energia verso regioni ad alta energia?", "o": ["Solo acqua", "Energia: si parla di trasporto attivo", "Nulla: avviene spontaneamente", "Solo luce solare"], "a": 1, "e": "Muovere molecole in direzione opposta a quella spontanea richiede energia: sono i movimenti attivi."}, {"s": 32, "q": "Da quali fattori dipendono i movimenti delle sostanze attraverso la membrana?", "o": ["Solo dalla massa della cellula", "Solo dal colore del soluto", "Solo dalla temperatura esterna", "Dalla concentrazione del soluto e, se è uno ione, dalla sua carica"], "a": 3, "e": "La slide elenca due fattori: la concentrazione del soluto e la sua carica, quando si tratta di uno ione. Per gli ioni quindi conta anche la differenza di potenziale elettrico ai due lati della membrana."}, {"s": 32, "q": "Come varia l'energia di un soluto al variare della sua concentrazione?", "o": ["Diminuisce all'aumentare della concentrazione", "Si annulla ad alte concentrazioni", "Cresce all'aumentare della concentrazione", "Non dipende dalla concentrazione"], "a": 2, "e": "Secondo la slide l'energia cresce all'aumentare della concentrazione del soluto. Ne consegue che il soluto si muove spontaneamente da dove è più concentrato (energia alta) a dove è meno concentrato."}, {"s": 32, "q": "Che cosa significa che un soluto «segue il gradiente»?", "o": ["Si muove sempre verso il nucleo", "Si muove da bassa ad alta concentrazione consumando ATP", "Si muove passivamente da una regione ad alta concentrazione a una a bassa concentrazione", "Resta fermo"], "a": 2, "e": "Seguire il gradiente significa spostarsi passivamente da dove la concentrazione è alta a dove è bassa, senza consumo di energia. È il movimento spontaneo descritto nella slide."}, {"s": 33, "q": "Quali sono i trasporti passivi elencati nella classificazione?", "o": ["Diffusione semplice, osmosi, diffusione facilitata, passaggio attraverso canali", "Solo osmosi ed esocitosi", "Solo diffusione semplice e pompe", "Pompe, cotrasportatori, controtrasportatori, endocitosi/esocitosi"], "a": 0, "e": "I trasporti passivi, che non richiedono energia, sono: 1) diffusione semplice, 2) osmosi, 3) diffusione facilitata, 4) passaggio attraverso canali."}, {"s": 33, "q": "Quali sono i trasporti attivi elencati nella classificazione?", "o": ["Diffusione semplice, osmosi, diffusione facilitata, canali", "Pompe, cotrasportatori, controtrasportatori, endocitosi/esocitosi", "Solo osmosi", "Solo diffusione semplice"], "a": 1, "e": "I trasporti attivi, che richiedono energia, sono: 1) pompe, 2) cotrasportatori, 3) controtrasportatori, 4) endocitosi/esocitosi."}, {"s": 33, "q": "Quali trasporti passivi NON richiedono proteine secondo la classificazione?", "o": ["Diffusione facilitata e canali", "Pompe e cotrasportatori", "Endocitosi ed esocitosi", "Diffusione semplice e osmosi"], "a": 3, "e": "Nella tabella il segno di spunta indica la necessità di proteine. Tra i passivi lo hanno diffusione facilitata e canali; diffusione semplice e osmosi no, perché le sostanze attraversano direttamente il doppio strato."}, {"s": 33, "q": "Quali trasporti, secondo la classificazione, richiedono proteine?", "o": ["Solo le pompe", "Nessuno", "Solo diffusione semplice e osmosi", "Diffusione facilitata, canali, pompe, cotrasportatori, controtrasportatori ed endocitosi/esocitosi"], "a": 3, "e": "Il segno di spunta «necessità proteine» compare su tutti i trasporti tranne diffusione semplice e osmosi. Anche endocitosi ed esocitosi sono segnate, perché coinvolgono proteine (per esempio recettori e clatrina)."}, {"s": 33, "q": "La differenza fondamentale tra trasporti passivi e attivi è che:", "o": ["I passivi richiedono ATP, gli attivi no", "I passivi riguardano solo l'acqua", "I passivi non richiedono energia, gli attivi sì", "Gli attivi avvengono solo nei neuroni"], "a": 2, "e": "La classificazione divide i meccanismi in passivi, che non richiedono energia, e attivi, che la richiedono. La presenza di proteine non è il criterio: anche alcuni passivi usano proteine."}, {"s": 35, "q": "Quale legge governa la diffusione semplice?", "o": ["La legge di Ohm", "La legge di Fick", "La legge di Van't Hoff", "La legge di Boyle"], "a": 1, "e": "La diffusione semplice obbedisce alla legge della diffusione di Fick (F = P·A·ΔC). La legge di Van't Hoff riguarda invece la pressione osmotica."}, {"s": 35, "q": "Per quali sostanze funziona la diffusione semplice?", "o": ["Ioni e grosse molecole polari", "Solo glucosio e amminoacidi", "Gas, molecole idrofobiche e piccole molecole polari", "Solo proteine"], "a": 2, "e": "La diffusione semplice funziona per le stesse sostanze che attraversano il doppio strato: gas, molecole idrofobiche e piccole molecole polari."}, {"s": 36, "q": "Che cosa si intende per flusso netto?", "o": ["La velocità di una singola molecola", "Il numero di molecole che passano in una sola direzione ignorando l'altra", "Il numero totale di molecole presenti", "Il numero di molecole che vanno da un lato all'altro meno il numero di quelle che si muovono nella direzione opposta"], "a": 3, "e": "La slide definisce il flusso netto come la differenza tra le molecole che passano da un lato all'altro e quelle che si muovono nella direzione opposta. Le molecole si muovono in entrambe le direzioni; conta il bilancio."}, {"s": 36, "q": "Nell'esperimento della diffusione, qual è la condizione a)?", "o": ["Non c'è sostanza", "Tutta la sostanza si trova nel lato 2", "Tutta la sostanza si trova nel lato 1", "La sostanza è distribuita in modo uguale"], "a": 2, "e": "Nella condizione a) la sostanza è tutta nel lato 1 (1 M) e il lato 2 contiene acqua pura (0 M). Il gradiente è massimo."}, {"s": 36, "q": "Perché all'inizio dell'esperimento il passaggio dal lato 1 al lato 2 è molto spiccato?", "o": ["Perché la membrana è impermeabile dal lato 2", "Perché nel lato 2 non ci sono molecole che possano tornare nel lato 1", "Perché si consuma ATP", "Perché le molecole del lato 2 sono più veloci"], "a": 1, "e": "All'inizio il lato 2 non contiene molecole che, muovendosi casualmente, urtino la barriera e tornino nel lato 1. Il passaggio avviene quindi quasi solo in una direzione (freccia spessa)."}, {"s": 36, "q": "Nella condizione c) dell'esperimento, qual è il flusso netto?", "o": ["Zero, perché le molecole che passano da 1 a 2 sono uguali a quelle che passano da 2 a 1", "Non definibile", "Negativo", "Massimo"], "a": 0, "e": "Nella condizione c) le concentrazioni sono uguali (0,5 M e 0,5 M): le molecole continuano a muoversi, ma tante passano da 1 a 2 quante da 2 a 1. Il flusso netto è zero: è l'equilibrio."}, {"s": 36, "q": "All'equilibrio della diffusione, le molecole:", "o": ["Smettono completamente di muoversi", "Continuano a muoversi in entrambe le direzioni, ma il flusso netto è zero", "Si muovono solo verso il lato 1", "Si accumulano tutte nel lato 2"], "a": 1, "e": "Il movimento molecolare è casuale e non si ferma mai. All'equilibrio si annulla soltanto il flusso netto, perché i passaggi nei due sensi si bilanciano."}, {"s": 36, "q": "Nel grafico concentrazione/tempo dell'esperimento, cosa accade nel tempo?", "o": ["Entrambe le concentrazioni salgono a 1 M", "Entrambe restano costanti", "La concentrazione nel lato 1 scende da 1 a 0,5 M e quella del lato 2 sale da 0 a 0,5 M, poi si stabilizzano", "La concentrazione del lato 1 sale e quella del lato 2 scende"], "a": 2, "e": "Il grafico mostra la curva del lato 1 che scende e quella del lato 2 che sale fino a incontrarsi a 0,5 M: a quel punto il fenomeno si stabilizza."}, {"s": 36, "q": "Nella condizione b) dell'esperimento (0,75 M e 0,25 M), il flusso netto:", "o": ["Va dal lato 2 al lato 1", "È zero", "Va ancora dal lato 1 al lato 2, ma è minore che all'inizio", "È massimo"], "a": 2, "e": "In b) esiste ancora un gradiente (0,75 contro 0,25 M), quindi c'è ancora flusso netto verso il lato 2. Il gradiente però è più piccolo che in a), perciò il flusso è minore."}, {"s": 36, "q": "Che caratteristica deve avere la barriera tra i due compartimenti nell'esperimento?", "o": ["Essere fatta di proteine", "Consumare ATP", "Essere permeabile alla sostanza in questione", "Essere impermeabile alla sostanza"], "a": 2, "e": "La slide parla di due compartimenti divisi da una barriera permeabile alla sostanza. Se non fosse permeabile non ci sarebbe diffusione."}, {"s": 37, "q": "Qual è la formula della legge di Fick riportata nelle slide?", "o": ["V = R · I", "F = P · A · ΔC", "π = C · i · R · T", "F = m · a"], "a": 1, "e": "La legge di Fick nelle slide è F = P·A·ΔC: flusso netto uguale a permeabilità per area per gradiente di concentrazione. π = CiRT è la legge di Van't Hoff."}, {"s": 37, "q": "Nella legge di Fick, che cosa rappresenta P?", "o": ["Il peso molecolare", "Il potenziale di membrana", "La permeabilità", "La pressione osmotica"], "a": 2, "e": "P è la permeabilità: indica quanto è facile il passaggio della sostanza attraverso quella membrana."}, {"s": 37, "q": "Nella legge di Fick, che cosa rappresenta A?", "o": ["L'area di superficie della membrana", "L'altezza della cellula", "L'affinità del trasportatore", "L'acqua presente"], "a": 0, "e": "A è l'area di superficie della membrana: più grande è l'area disponibile, maggiore è la quantità di sostanza che può passare."}, {"s": 37, "q": "Nella legge di Fick, che cosa rappresenta ΔC?", "o": ["La concentrazione assoluta su un solo lato", "La variazione di calore", "La variazione di carica", "Il gradiente di concentrazione, cioè la differenza di concentrazione tra i due lati"], "a": 3, "e": "ΔC è il gradiente di concentrazione: la differenza di concentrazione tra un lato e l'altro della membrana."}, {"s": 37, "q": "Da che cosa dipende la permeabilità P nella legge di Fick?", "o": ["Dalle caratteristiche chimiche sia della sostanza sia della membrana", "Solo dalla temperatura", "Solo dall'area della membrana", "Solo dal gradiente di concentrazione"], "a": 0, "e": "La permeabilità dipende dalle caratteristiche chimiche della sostanza e della membrana. A parità di membrana e di sostanza è una costante."}, {"s": 37, "q": "A parità di membrana e sostanza, la permeabilità P è:", "o": ["Sempre uguale a zero", "Variabile in ogni istante", "Uguale al gradiente", "Una costante"], "a": 3, "e": "La slide precisa che, a parità di membrana e sostanza, P è una costante: non varia a parità di condizioni."}, {"s": 37, "q": "Quale esempio fisiologico viene usato per illustrare il ruolo dell'area A?", "o": ["La superficie degli alveoli di due polmoni rispetto a uno determina la quantità di O₂ che passa nel sangue", "Il volume del cuore determina la frequenza", "La lunghezza dell'intestino determina la digestione", "La superficie della pelle determina la sudorazione"], "a": 0, "e": "L'esempio è la membrana respiratoria: la superficie di tutti gli alveoli di due polmoni, rispetto a quella di uno solo, determina quanto ossigeno passa nel sangue. Più area significa più flusso."}, {"s": 37, "q": "Se si raddoppia l'area di scambio mantenendo costanti P e ΔC, secondo Fick il flusso:", "o": ["Resta uguale", "Si dimezza", "Si annulla", "Raddoppia"], "a": 3, "e": "F = P·A·ΔC: il flusso è direttamente proporzionale all'area. Raddoppiando A, con gli altri fattori costanti, F raddoppia."}, {"s": 37, "q": "Se il gradiente di concentrazione ΔC si annulla, secondo Fick il flusso netto:", "o": ["È zero", "È massimo", "Dipende solo dall'area", "Raddoppia"], "a": 0, "e": "Essendo F proporzionale a ΔC, se le concentrazioni ai due lati sono uguali (ΔC = 0) il flusso netto è zero, come nella condizione c) dell'esperimento."}, {"s": 37, "q": "Che cosa indica una concentrazione di «1 Molare» nell'esempio della slide sulla legge di Fick?", "o": ["Che la sostanza è uguale nei due lati", "Che tutta la sostanza è da un lato e niente dall'altro (lato 2 acqua pura)", "Che non c'è sostanza", "Che la membrana è impermeabile"], "a": 1, "e": "Nell'esempio il lato 1 è 1 M e il lato 2 è 0 M (acqua pura): la sostanza è tutta da una parte, quindi il gradiente è massimo."}, {"s": 38, "q": "Nel grafico della diffusione semplice, che relazione c'è tra gradiente di concentrazione e flusso netto?", "o": ["Una curva che si satura (iperbole)", "Proporzionalità diretta: il grafico è una retta", "Nessuna relazione", "Proporzionalità inversa"], "a": 1, "e": "Con ΔC sulle x e flusso netto sulle y, la diffusione semplice dà una retta passante per l'origine: il flusso è direttamente proporzionale al gradiente, senza saturazione."}, {"s": 38, "q": "Nel grafico della diffusione semplice compaiono due rette con pendenze diverse. Da cosa dipende la differenza?", "o": ["Dal numero di trasportatori", "Dall'area della cellula soltanto", "Dalla permeabilità", "Dal consumo di ATP"], "a": 2, "e": "Le due rette differiscono per la permeabilità: quella con pendenza maggiore corrisponde a una sostanza più permeabile in quella membrana, quindi a una diffusione più elevata."}, {"s": 38, "q": "Qual è l'andamento grafico tipico della diffusione semplice?", "o": ["Un'iperbole", "Un'onda sinusoidale", "Una parabola", "Una retta"], "a": 3, "e": "La slide conclude: andamento della diffusione semplice → RETTA. La diffusione facilitata invece mostra un'iperbole perché i trasportatori si saturano."}, {"s": 38, "q": "Nel grafico della diffusione semplice, cosa rappresenta la pendenza della retta?", "o": ["Il numero di ioni dissociati", "La permeabilità (insieme all'area): più è alta, maggiore è il flusso a parità di gradiente", "La temperatura", "Il tempo"], "a": 1, "e": "Poiché F = P·A·ΔC, la pendenza della retta F contro ΔC è il prodotto P·A. Nel grafico, a parità di area, rette più ripide indicano permeabilità più elevata."}, {"s": 40, "q": "Che cosa si intende per osmosi?", "o": ["Il passaggio di acqua (solvente) attraverso una membrana semipermeabile", "Il passaggio di soluto attraverso una membrana semipermeabile", "L'ingresso di particelle tramite vescicole", "Il trasporto attivo di ioni"], "a": 0, "e": "L'osmosi è il passaggio di acqua, cioè del solvente, attraverso una membrana semipermeabile. A muoversi è l'acqua, non il soluto."}, {"s": 40, "q": "Una membrana semipermeabile è:", "o": ["Permeabile a tutto", "Permeabile al soluto e impermeabile al solvente", "Impermeabile a tutto", "Impermeabile al soluto e permeabile al solvente"], "a": 3, "e": "La legenda della slide indica che la membrana semipermeabile è impermeabile al soluto e permeabile al solvente: lascia passare l'acqua ma non le molecole disciolte."}, {"s": 41, "q": "In quale direzione si muove il solvente nell'osmosi?", "o": ["Dalla soluzione meno concentrata a quella più concentrata", "Dalla soluzione più concentrata a quella meno concentrata", "In nessuna direzione", "Sempre dall'interno all'esterno della cellula"], "a": 0, "e": "Il solvente si muove dall'ambiente con soluzione meno concentrata a quello con soluzione più concentrata, tendendo a equilibrare la concentrazione del solvente stesso."}, {"s": 41, "q": "Perché si dice che l'acqua, nell'osmosi, segue il proprio gradiente di concentrazione?", "o": ["Perché dove c'è più soluto c'è meno acqua, e l'acqua va da dove è più concentrata a dove lo è meno", "Perché l'acqua è carica", "Perché l'acqua si muove sempre verso il soluto meno concentrato", "Perché l'acqua consuma ATP"], "a": 0, "e": "Nel comparto con più soluto l'acqua è relativamente meno concentrata. Quindi l'acqua passa da dove è più concentrata (poco soluto) a dove è meno concentrata (molto soluto), esattamente come nella diffusione semplice."}, {"s": 41, "q": "A quale legge obbedisce il movimento dell'acqua secondo la slide sull'osmosi?", "o": ["La legge di Dalton", "La legge di Mendel", "La legge di Fick", "La legge di Van't Hoff"], "a": 2, "e": "La slide afferma che l'acqua segue la legge di Fick (F = P·A·ΔC), come ogni processo diffusivo. La legge di Van't Hoff serve invece a calcolare la pressione osmotica."}, {"s": 41, "q": "L'acqua si sposta verso dove il soluto è:", "o": ["Meno concentrato", "Più concentrato", "Assente", "Carico negativamente"], "a": 1, "e": "Il movimento dell'acqua va da dove il soluto è meno concentrato a dove il soluto è più concentrato."}, {"s": 41, "q": "Quale frase della slide riassume la forza che muove l'acqua nell'osmosi?", "o": ["La membrana spinge l'acqua", "Il soluto attira con una forza l'acqua", "L'acqua respinge il soluto", "Il solvente consuma energia"], "a": 1, "e": "La frase evidenziata è: il soluto attira con una forza l'acqua. Questa forza di richiamo è la pressione osmotica."}, {"s": 41, "q": "Nell'osmosi, a cosa tende il passaggio di acqua?", "o": ["A consumare ATP", "A equilibrare la concentrazione del solvente nei due ambienti", "Ad aumentare la differenza di concentrazione", "A spostare il soluto"], "a": 1, "e": "Il passaggio del solvente tende a equilibrare la concentrazione del solvente stesso nei due ambienti, riducendo la differenza tra le due soluzioni."}, {"s": 42, "q": "Da cosa dipende la forza con cui il soluto attira l'acqua?", "o": ["Dalla concentrazione del soluto: più è concentrato, maggiore è la forza", "Dal colore del soluto", "Dalla velocità dell'acqua", "Dal numero di mitocondri"], "a": 0, "e": "La slide risponde: tanto più il soluto è concentrato, tanto maggiore sarà la forza con cui attira l'acqua."}, {"s": 42, "q": "Nell'esperimento della pressione osmotica, cosa contengono i compartimenti A e B?", "o": ["A contiene la soluzione con il soluto, B il solvente (acqua)", "Entrambi contengono solo acqua", "A contiene acqua, B soluto", "Entrambi contengono la stessa soluzione"], "a": 0, "e": "Due compartimenti rigidi sono separati da una membrana semipermeabile: A contiene il soluto, B è pieno di solvente (acqua)."}, {"s": 42, "q": "Nell'esperimento con lo stantuffo, cosa accade se lo stantuffo viene lasciato libero?", "o": ["Il compartimento A richiama acqua da B, il suo volume aumenta e lo stantuffo si sposta indietro", "Il soluto passa in B", "Lo stantuffo resta fermo", "L'acqua passa da A a B"], "a": 0, "e": "Lasciando libero lo stantuffo, A attira acqua da B. Poiché le pareti sono rigide, l'aumento di volume di A spinge indietro lo stantuffo mobile."}, {"s": 42, "q": "Come si misura la pressione osmotica nell'esperimento con lo stantuffo?", "o": ["Misurando il tempo di equilibrio", "Misurando la forza esattamente sufficiente a controbilanciare l'entrata di acqua", "Misurando la temperatura", "Misurando il volume finale di B"], "a": 1, "e": "Si applica sullo stantuffo una forza esattamente sufficiente a impedire l'ingresso di acqua in A: quella forza, misurata, corrisponde alla pressione osmotica."}, {"s": 42, "q": "Che cosa rappresenta la pressione osmotica?", "o": ["La forza con cui il soluto richiama acqua attraverso una membrana semipermeabile", "La pressione del sangue nelle arterie", "La forza con cui la membrana respinge l'acqua", "La pressione atmosferica"], "a": 0, "e": "La pressione osmotica è la misura della forza di richiamo dell'acqua esercitata dal soluto: è la pressione che occorre applicare per bloccare il flusso osmotico."}, {"s": 43, "q": "Come vengono descritte le pressioni osmotiche esercitate dalle soluzioni?", "o": ["Sempre uguali a zero", "Trascurabili", "Pari alla pressione arteriosa", "Enormi"], "a": 3, "e": "La slide afferma che le pressioni osmotiche sono enormi: una soluzione 1 molare esercita una pressione di tantissime atmosfere."}, {"s": 43, "q": "Che conseguenza ha il fatto che le pressioni osmotiche siano molto elevate?", "o": ["Servono grandi differenze per spostare acqua", "L'acqua non si muove mai", "Piccole differenze di concentrazione hanno un effetto molto forte nel richiamare acqua nei liquidi biologici", "Le differenze di concentrazione non contano"], "a": 2, "e": "Poiché le pressioni in gioco sono enormi, anche piccole differenze di concentrazione bastano a spostare quantità importanti di acqua. Per questo le concentrazioni dei liquidi biologici devono essere controllate con precisione."}, {"s": 43, "q": "Come viene definita l'osmolarità nella slide?", "o": ["Il numero di moli di soluto per kg di solvente", "La massa del soluto", "Il volume della soluzione", "La pressione osmotica generata dai soluti presenti in 1 L di soluzione"], "a": 3, "e": "La slide la definisce come la pressione osmotica generata dai soluti presenti in 1 L di soluzione. In termini pratici si esprime come numero di osmoli (particelle osmoticamente attive) per litro."}, {"s": 43, "q": "Che cos'è la molarità?", "o": ["Il numero di particelle per kg di acqua", "Il numero di moli di soluto per litro di soluzione", "La massa di soluto per litro", "Il numero di ioni dissociati"], "a": 1, "e": "La nota della slide definisce la molarità come numero di moli (quantità di sostanza) di soluto per litro di soluzione."}, {"s": 44, "q": "Qual è la formula della legge di Van't Hoff?", "o": ["PV = nRT soltanto", "π = C · i · R · T", "F = P · A · ΔC", "π = C / T"], "a": 1, "e": "La legge di Van't Hoff è π = C·i·R·T: pressione osmotica uguale a concentrazione dei soluti per numero di ioni di dissociazione per costante dei gas per temperatura assoluta."}, {"s": 44, "q": "Nella legge di Van't Hoff, che cosa rappresenta π?", "o": ["La pressione osmotica", "La permeabilità", "Il flusso netto", "Il potenziale elettrico"], "a": 0, "e": "π è la pressione osmotica, la grandezza calcolata dalla legge."}, {"s": 44, "q": "Nella legge di Van't Hoff, che cosa rappresenta i?", "o": ["L'area della membrana", "L'indice di rifrazione", "Il numero di ioni prodotti per dissociazione", "L'intensità di corrente"], "a": 2, "e": "i indica il numero di ioni per dissociazione (fattore di Van't Hoff): quante particelle libera in soluzione ogni unità di soluto."}, {"s": 44, "q": "Nella legge di Van't Hoff, che cosa rappresenta C?", "o": ["La capacità di membrana", "La costante dei gas", "La carica elettrica", "La concentrazione dei soluti"], "a": 3, "e": "C è la concentrazione dei soluti. La pressione osmotica è direttamente proporzionale a essa."}, {"s": 44, "q": "Secondo Van't Hoff, se si raddoppia la concentrazione di soluto non dissociabile a temperatura costante, la pressione osmotica:", "o": ["Raddoppia", "Quadruplica", "Resta uguale", "Si dimezza"], "a": 0, "e": "π = C·i·R·T è proporzionale a C. Raddoppiando C, con i, R e T costanti, π raddoppia."}, {"s": 45, "q": "Per la pressione osmotica, che cosa conta?", "o": ["La massa delle particelle", "Il tipo di legame chimico", "Il colore della soluzione", "Il numero di particelle in soluzione"], "a": 3, "e": "La slide sottolinea che per la pressione osmotica conta il numero di particelle. Per questo bisogna tenere conto della dissociazione."}, {"s": 45, "q": "Perché 1 mole di NaCl in soluzione esercita una pressione osmotica circa doppia rispetto a 1 mole di glucosio?", "o": ["Perché il glucosio non si scioglie", "Perché NaCl consuma ATP", "Perché il sodio è più pesante del glucosio", "Perché NaCl si dissocia in Na⁺ e Cl⁻, liberando due particelle per unità"], "a": 3, "e": "Il glucosio in soluzione resta una sola molecola, mentre NaCl si dissocia in 1 mole di ioni sodio e 1 mole di ioni cloro: le particelle raddoppiano, e con esse la forza di richiamo dell'acqua."}, {"s": 45, "q": "Una mole di NaCl immersa in soluzione dà:", "o": ["1 mole di ioni Na⁺ e 1 mole di ioni Cl⁻", "1 mole di molecole NaCl", "2 moli di Na⁺", "Mezza mole di particelle"], "a": 0, "e": "NaCl si dissocia completamente in Na⁺ e Cl⁻: 1 mole di ioni sodio più 1 mole di ioni cloro, cioè 2 moli di particelle."}, {"s": 46, "q": "Come si calcola l'osmolarità a partire dalla molarità?", "o": ["Osmolarità = molarità × ioni di dissociazione", "Osmolarità = molarità ÷ ioni di dissociazione", "Osmolarità = molarità + 1", "Osmolarità = molarità × temperatura"], "a": 0, "e": "La slide riporta: osmolarità = molarità × ioni di dissociazione, cioè il numero di particelle in cui si separa ciascuna unità di soluto."}, {"s": 46, "q": "Una soluzione di glucosio 1 M ha osmolarità pari a:", "o": ["0,5 Osm", "2 Osm", "1 Osm", "3 Osm"], "a": 2, "e": "Il glucosio non si dissocia (ioni di dissociazione = 1), quindi l'osmolarità coincide con la molarità: 1 M = 1 Osm."}, {"s": 46, "q": "Una soluzione di NaCl 1 M ha osmolarità pari a:", "o": ["0,5 Osm", "2 Osm", "1 Osm", "4 Osm"], "a": 1, "e": "NaCl si dissocia in due ioni, quindi 1 M × 2 = 2 Osm."}, {"s": 46, "q": "Qual è l'osmolarità dei liquidi biologici secondo la slide?", "o": ["300 mOsm/L", "150 mOsm/L", "3000 mOsm/L", "600 mOsm/L"], "a": 0, "e": "La slide indica un'osmolarità dei liquidi biologici di circa 300 mOsm (milliosmoli per litro). È il valore usato poi negli esempi del globulo rosso."}, {"s": 46, "q": "Quando l'osmolarità coincide con la molarità?", "o": ["Quando gli ioni di dissociazione sono 1, cioè la sostanza non si dissocia", "Sempre", "Mai", "Quando la sostanza si dissocia in due ioni"], "a": 0, "e": "Se il soluto non si dissocia, ogni mole resta una sola mole di particelle: in questo caso osmolarità = molarità."}, {"s": 46, "q": "Quale sarebbe l'osmolarità di una soluzione 0,15 M di NaCl, ipotizzando dissociazione completa?", "o": ["0,075 Osm", "0,15 Osm", "0,6 Osm", "0,3 Osm, cioè 300 mOsm"], "a": 3, "e": "Applicando la formula della slide: 0,15 M × 2 ioni = 0,3 Osm = 300 mOsm. È per questo che una soluzione di NaCl di circa 0,9% (0,15 M) è vicina all'osmolarità dei liquidi biologici."}, {"s": 47, "q": "Quando si parla di tonicità?", "o": ["Quando si confronta la forza di richiamo dell'acqua di due soluzioni diverse messe vicine", "Quando si misura la temperatura", "Quando si calcola la molarità di una sola soluzione", "Quando si misura la tensione muscolare"], "a": 0, "e": "La tonicità è un concetto di confronto: si parla di tonicità quando si mette a paragone la forza osmotica di due soluzioni vicine, separate da una membrana."}, {"s": 47, "q": "Come viene definita la tonicità nella slide?", "o": ["Il numero di moli per litro", "La capacità di una soluzione di modificare il volume cellulare attraverso il movimento osmotico dell'acqua", "La velocità di diffusione di un gas", "La pressione arteriosa"], "a": 1, "e": "La tonicità è la capacità di una soluzione di modificare il volume della cellula tramite il movimento osmotico dell'acqua, in entrata o in uscita."}, {"s": 47, "q": "Da cosa dipende la tonicità?", "o": ["Dalla quantità di ATP", "Dalla temperatura", "Dalla concentrazione relativa dei soluti non permeanti ai due lati della membrana", "Dalla concentrazione assoluta di tutti i soluti, permeanti compresi"], "a": 2, "e": "La tonicità dipende dalla concentrazione relativa dei soluti non permeanti: solo i soluti che non attraversano la membrana possono trattenere o richiamare acqua in modo stabile e cambiare il volume della cellula."}, {"s": 47, "q": "Perché nella tonicità contano solo i soluti non permeanti?", "o": ["Perché i soluti permeanti sono sempre carichi", "Perché un soluto che attraversa la membrana si distribuisce ai due lati e non mantiene un richiamo d'acqua stabile", "Perché i soluti permeanti consumano ATP", "Perché i soluti non permeanti non hanno massa"], "a": 1, "e": "Se un soluto attraversa la membrana, tende a equilibrare la propria concentrazione ai due lati e il suo effetto osmotico si annulla. Solo i soluti che restano confinati da una parte mantengono una differenza capace di spostare acqua e cambiare il volume cellulare."}, {"s": 48, "q": "Nella figura sulla tonicità, quale osmolarità interna ha il globulo rosso?", "o": ["600", "1000", "300", "150"], "a": 2, "e": "Il globulo rosso ha osmolarità 300, pari a quella dei liquidi biologici. Le soluzioni esterne della figura sono 600 e 150."}, {"s": 49, "q": "Un globulo rosso (300 mOsm) è immerso in una soluzione a 150 mOsm. Cosa accade?", "o": ["Richiama acqua, aumenta di volume fino a
